<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>SCAN TEST v4.4</title>

<script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,body{

  margin:0;
  padding:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#0b0f14;

  color:#fff;

  font-family:Arial,Helvetica,sans-serif;

}

body{

  display:flex;

  flex-direction:column;

}


/* ================= HEADER ================= */

.header{

  flex:0 0 auto;

  background:linear-gradient(
    135deg,
    #1976d2,
    #1565c0
  );

  padding:8px 6px;

  text-align:center;

  font-size:19px;

  font-weight:800;

  box-shadow:0 2px 8px rgba(0,0,0,.35);

}


/* ================= VERSION ================= */

.version{

  flex:0 0 auto;

  background:#18242a;

  color:#39ff78;

  text-align:center;

  padding:5px 4px;

  font-size:11px;

  font-weight:800;

  letter-spacing:.5px;

  border-bottom:1px solid #304047;

}


/* ================= CONTAINER ================= */

.container{

  width:100%;

  max-width:650px;

  margin:0 auto;

  padding:6px 10px;

  flex:1;

  min-height:0;

  display:flex;

  flex-direction:column;

}


/* ================= TITLE ================= */

.title{

  flex:0 0 auto;

  text-align:center;

  font-size:17px;

  font-weight:800;

  margin:2px 0 5px;

}


/* ================= STATUS ================= */

.status{

  flex:0 0 auto;

  background:linear-gradient(
    135deg,
    #20272e,
    #171d22
  );

  border:1px solid #303941;

  border-radius:9px;

  padding:7px;

  text-align:center;

  min-height:36px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:12px;

  margin-bottom:6px;

  box-shadow:0 2px 6px rgba(0,0,0,.25);

}


/* ================= CAMERA ================= */

#scanner{

  position:relative;

  width:100%;

  height:220px;

  flex:0 0 220px;

  background:#000;

  border-radius:12px;

  overflow:hidden;

  border:2px solid #39434b;

  box-shadow:0 4px 14px rgba(0,0,0,.45);

}


#scanner video{

  width:100%!important;

  height:100%!important;

  display:block;

  object-fit:cover;

}


#scanner canvas{

  position:absolute!important;

  top:0!important;

  left:0!important;

  width:100%!important;

  height:100%!important;

  pointer-events:none;

}


/* ================= GREEN FRAME ================= */

.scan-frame{

  position:absolute;

  left:7%;

  right:7%;

  top:27%;

  height:46%;

  border:3px solid #39ff68;

  border-radius:10px;

  pointer-events:none;

  box-shadow:
    0 0 8px rgba(57,255,104,.7),
    inset 0 0 8px rgba(57,255,104,.15);

  z-index:10;

}


.scan-line{

  position:absolute;

  left:3%;

  right:3%;

  top:50%;

  height:2px;

  background:#39ff68;

  box-shadow:0 0 9px #39ff68;

}


/* ================= ZOOM ================= */

.zoom-row{

  flex:0 0 auto;

  height:38px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  margin-top:5px;

}


.zoom-btn{

  width:58px;

  height:34px;

  padding:0;

  margin:0;

  border-radius:9px;

  border:1px solid #505b64;

  background:linear-gradient(
    180deg,
    #39434b,
    #293138
  );

  color:#fff;

  font-size:22px;

  font-weight:800;

}


.zoom-value{

  width:78px;

  text-align:center;

  font-size:13px;

  color:#e0e6eb;

  font-weight:800;

}


/* ================= INSTRUCTION ================= */

.instruction{

  flex:0 0 auto;

  text-align:center;

  color:#b8c1c8;

  font-size:11px;

  line-height:1.25;

  margin:3px 0;

}


/* ================= SCAN INFO ================= */

.scan-info{

  flex:0 0 auto;

  text-align:center;

  color:#8f9ba4;

  font-size:11px;

  min-height:15px;

  margin:2px 0;

}


/* ================= BUTTONS ================= */

button{

  border:none;

  cursor:pointer;

  touch-action:manipulation;

  font-weight:bold;

  -webkit-tap-highlight-color:transparent;

}


button:active{

  transform:scale(.97);

}


.main-btn{

  width:100%;

  height:42px;

  flex:0 0 42px;

  border-radius:9px;

  font-size:16px;

  margin-top:3px;

}


.start{

  background:linear-gradient(
    135deg,
    #18d866,
    #0dbb50
  );

  color:#fff;

}


.stop{

  background:linear-gradient(
    135deg,
    #ef4444,
    #c62828
  );

  color:#fff;

}


/* ================= RESULT ================= */

.result{

  display:none;

  flex:0 0 auto;

  background:linear-gradient(
    135deg,
    #155d22,
    #104b1b
  );

  border:1px solid #267a35;

  padding:8px;

  border-radius:10px;

  text-align:center;

  margin-top:5px;

  box-shadow:0 3px 10px rgba(0,0,0,.35);

}


.result-title{

  font-size:15px;

  font-weight:800;

  margin-bottom:5px;

}


.barcode-value{

  font-size:21px;

  font-weight:800;

  letter-spacing:.5px;

  word-break:break-all;

  background:rgba(0,0,0,.28);

  padding:8px;

  border-radius:7px;

  max-height:58px;

  overflow:hidden;

}


/* ================= RESULT BUTTONS ================= */

.result-buttons{

  width:100%;

  display:flex;

  flex-direction:row;

  gap:12px;

  margin-top:7px;

}


.result-buttons button{

  flex:1;

  width:50%;

  height:43px;

  margin:0;

  padding:0 5px;

  border-radius:8px;

  font-size:14px;

  font-weight:800;

  white-space:nowrap;

}


.again-btn{

  background:linear-gradient(
    135deg,
    #59636b,
    #454e55
  );

  color:#fff;

}


.use-btn{

  background:linear-gradient(
    135deg,
    #fff,
    #e8f5e9
  );

  color:#146521;

}


/* ================= CAMERA ACTION BUTTONS ================= */

.action-buttons{

  width:100%;

  display:flex;

  flex-direction:row;

  align-items:stretch;

  justify-content:center;

  gap:12px;

  margin:6px 0 4px;

}


.action-buttons .main-btn{

  width:50%;

  flex:1 1 0;

  margin-top:0;

  height:48px;

  min-height:48px;

  font-size:15px;

  border-radius:10px;

}


.back{

  background:linear-gradient(
    135deg,
    #4b5b6b,
    #303d49
  );

  color:#fff;

  border:1px solid #627384;

}


/* ================= HIDDEN ================= */

.hidden{

  display:none!important;

}


/* ================= FOOTER ================= */

.small-info{

  flex:0 0 auto;

  text-align:center;

  color:#56616a;

  font-size:9px;

  margin-top:3px;

}


/* ================= SMALL PHONE ================= */

@media(max-height:700px){

  .header{

    padding:6px;

    font-size:17px;

  }


  .version{

    padding:4px;

    font-size:10px;

  }


  .title{

    font-size:16px;

  }


  #scanner{

    height:185px;

    flex-basis:185px;

  }


  .zoom-row{

    height:34px;

  }


  .zoom-btn{

    height:32px;

  }


  .instruction{

    font-size:10px;

  }


  .main-btn{

    height:39px;

    flex-basis:39px;

    font-size:15px;

  }


  .barcode-value{

    font-size:19px;

  }


  .result-buttons button{

    height:39px;

    font-size:13px;

  }


  .action-buttons{

    gap:10px;

    margin-top:5px;

  }


  .action-buttons .main-btn{

    height:46px;

    min-height:46px;

    flex-basis:0;

    font-size:14px;

  }

}

</style>

</head>


<body>


<div class="header">

📷 BARCODE SCANNER

</div>


<div class="version">

🟢 SCAN TEST v4.4 • FAST + SMART READ

</div>


<div class="container">


<div class="title">

Scan Any Barcode

</div>


<div
  id="status"
  class="status"
>

📷 Camera starting automatically...

</div>


<div id="scanner">

  <div class="scan-frame">

    <div class="scan-line"></div>

  </div>

</div>


<div class="zoom-row">


<button
  class="zoom-btn"
  onclick="changeZoom(-0.5)"
>

−

</button>


<div
  id="zoomValue"
  class="zoom-value"
>

Zoom 1.0×

</div>


<button
  class="zoom-btn"
  onclick="changeZoom(0.5)"
>

+

</button>


</div>


<div class="instruction">

Barcode ko green frame mein rakhein.

<br>

Number + Alphabet dono allowed.

</div>


<div
  id="scanInfo"
  class="scan-info"
>

🔎 Fast smart scan...

</div>


<button
  id="startBtn"
  class="main-btn start hidden"
  onclick="startScanner()"
>

📷 START CAMERA

</button>

<button
  id="stopBtn"
  class="main-btn stop hidden"
  onclick="stopScanner()"
>

✕ STOP CAMERA

</button>

  id="backBtn"
  class="main-btn back"
  onclick="backToForm()"
>

← BACK TO FORM

</button>

<div
  id="result"
  class="result"
>


<div class="result-title">

✅ BARCODE SCANNED

</div>


<div
  id="barcodeValue"
  class="barcode-value"
>
</div>


<div class="result-buttons">


<button
  class="again-btn"
  onclick="scanAgain()"
>

🔄 SCAN AGAIN

</button>

  class="use-btn"
  onclick="sendBarcodeBack()"
>

✓ ACCEPT

</button>


</div>


</div>


<div class="small-info">

SCAN TEST v4.4 • FAST + SMART READ

</div>


</div>


<script>


/* =================================================
   VERSION
   ================================================= */

console.log(
  'SCAN TEST v4.4 • FAST + SMART READ'
);


/* =================================================
   VARIABLES
   ================================================= */

let scanning=false;

let scannerRunning=false;

let currentValue='';


let candidateValue='';

let candidateFormat='';

let candidateCount=0;

let candidateTime=0;


let currentZoom=1;

let minZoom=1;

let maxZoom=1;

let hardwareZoomSupported=false;


/* =================================================
   START CAMERA
   ================================================= */

function startScanner(){

  const status=
    document.getElementById('status');

  const startBtn=
    document.getElementById('startBtn');

  const stopBtn=
    document.getElementById('stopBtn');

  const result=
    document.getElementById('result');

  const scanInfo=
    document.getElementById('scanInfo');


  try{


    if(typeof Quagga==='undefined'){

      throw new Error(
        'Scanner library load nahi hui.'
      );

    }


    scanning=true;

    scannerRunning=false;

    currentValue='';

    candidateValue='';

    candidateFormat='';

    candidateCount=0;

    candidateTime=0;

    currentZoom=1;


    result.style.display='none';


    startBtn.classList.add('hidden');

    stopBtn.classList.remove('hidden');


    status.textContent=
      '📷 Camera starting...';


    scanInfo.textContent=
      '🔎 Fast smart scan...';


    /* =============================================
       CAMERA
       ============================================= */

    const config={


      inputStream:{

        name:'Live',

        type:'LiveStream',

        target:
          document.getElementById(
            'scanner'
          ),

        constraints:{

          facingMode:{
            ideal:'environment'
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          },

          frameRate:{
            ideal:30
          }

        },


        area:{

          top:'20%',

          right:'5%',

          left:'5%',

          bottom:'20%'

        }

      },


      /* =========================================
         SPEED

         halfSample true =
         considerably less processing.

         Higher camera resolution compensates.
         ========================================= */

      locator:{

        patchSize:'large',

        halfSample:true

      },


      numOfWorkers:
        navigator.hardwareConcurrency
          ? Math.min(
              4,
              navigator.hardwareConcurrency
            )
          : 2,


      frequency:15,


      /* =========================================
         BARCODE READERS
         ========================================= */

      decoder:{

        readers:[

          'code_128_reader',

          'code_39_reader',

          'code_39_vin_reader',

          'code_93_reader',

          'ean_reader',

          'ean_8_reader',

          'upc_reader',

          'upc_e_reader',

          'codabar_reader',

          'i2of5_reader',

          '2of5_reader'

        ],

        multiple:false

      },


      /*
       * Barcode position already guided
       * by green frame.
       *
       * This avoids expensive full-frame
       * localization and makes scanning faster.
       */

      locate:false,

      debug:false

    };


    Quagga.init(
      config,
      function(error){

        if(error){

          console.error(
            'QUAGGA ERROR:',
            error
          );


          scanning=false;


          startBtn.classList.remove(
            'hidden'
          );

          stopBtn.classList.add(
            'hidden'
          );


          status.textContent=
            '⚠️ Camera auto-start nahi hua. START CAMERA dabayein.';


          scanInfo.textContent=
            '📷 Manual start available';


          return;

        }


        Quagga.start();


        scannerRunning=true;


        status.textContent=
          '🟢 Camera ON — FAST SMART SCAN';


        scanInfo.textContent=
          '🔎 Barcode ko green frame mein rakhein...';


        setTimeout(
          setupZoom,
          600
        );

      }
    );


  }catch(error){

    console.error(
      error
    );


    scanning=false;


    startBtn.classList.remove(
      'hidden'
    );


    stopBtn.classList.add(
      'hidden'
    );


    status.textContent=
      '❌ '+
      (
        error.message||
        error
      );

  }

}


/* =================================================
   AUTO START
   ================================================= */

function autoStartCamera(){

  setTimeout(
    function(){

      startScanner();

    },
    250
  );

}


/* =================================================
   BARCODE QUALITY CHECK
   ================================================= */

/*
 * Quagga result.codeResult.decodedCodes
 * mein individual decoding errors milte hain.
 *
 * Lower error = stronger decode.
 *
 * Isse random false positives ko filter
 * karne mein help milti hai.
 */

function getBarcodeQuality(result){

  try{

    if(
      !result||
      !result.codeResult||
      !Array.isArray(
        result.codeResult.decodedCodes
      )
    ){

      return null;

    }


    const errors=[];


    result.codeResult.decodedCodes.forEach(
      function(item){

        if(
          item &&
          typeof item.error==='number' &&
          Number.isFinite(item.error)
        ){

          errors.push(
            item.error
          );

        }

      }
    );


    if(!errors.length){

      return null;

    }


    /*
     * Average error.
     */

    let total=0;


    errors.forEach(
      function(error){

        total+=error;

      }
    );


    const average=
      total/errors.length;


    /*
     * Median error.
     */

    const sorted=
      errors
        .slice()
        .sort(
          function(a,b){
            return a-b;
          }
        );


    const middle=
      Math.floor(
        sorted.length/2
      );


    let median;


    if(
      sorted.length%2
    ){

      median=
        sorted[middle];

    }else{

      median=
        (
          sorted[middle-1]+
          sorted[middle]
        )/2;

    }


    return{

      average:average,

      median:median

    };


  }catch(error){

    console.log(
      'Quality check error:',
      error
    );


    return null;

  }

}


/* =================================================
   BARCODE DETECTED
   ================================================= */

Quagga.onDetected(
  function(result){

    if(!scanning){

      return;

    }


    if(
      !result||
      !result.codeResult
    ){

      return;

    }


    const value=
      String(
        result.codeResult.code||
        ''
      ).trim();


    if(!value){

      return;

    }


    const format=
      String(
        result.codeResult.format||
        ''
      );


    const quality=
      getBarcodeQuality(
        result
      );


    console.log(
      'FOUND:',
      value,
      'FORMAT:',
      format,
      'QUALITY:',
      quality
    );


    /*
     * ==========================================
     * QUALITY FILTER
     *
     * Very strong decode:
     * accept immediately.
     *
     * Medium decode:
     * require one quick repeat.
     *
     * Poor decode:
     * ignore.
     * ==========================================
     */

    let qualityLevel='medium';


    if(quality){

      if(
        quality.median<=0.10 &&
        quality.average<=0.16
      ){

        qualityLevel='strong';

      }else if(
        quality.median<=0.18 &&
        quality.average<=0.24
      ){

        qualityLevel='medium';

      }else{

        qualityLevel='poor';

      }

    }


    /*
     * Strong result:
     * accept immediately.
     */

    if(
      qualityLevel==='strong'
    ){

      acceptBarcode(
        value
      );

      return;

    }


    /*
     * Poor result:
     * do not accept.
     */

    if(
      qualityLevel==='poor'
    ){

      document
        .getElementById(
          'scanInfo'
        )
        .textContent=
        '🔎 Searching...';


      return;

    }


    /*
     * Medium result:
     *
     * Same value within 600ms.
     */

    const now=
      Date.now();


    if(
      candidateValue===value&&
      candidateFormat===format&&
      (now-candidateTime)<=650
    ){

      candidateCount++;

    }else{

      candidateValue=value;

      candidateFormat=format;

      candidateCount=1;

    }


    candidateTime=now;


    document
      .getElementById(
        'scanInfo'
      )
      .textContent=
      '🔎 Confirming barcode...';


    /*
     * Second matching read.
     */

    if(
      candidateCount>=2
    ){

      acceptBarcode(
        value
      );

    }

  }
);


/* =================================================
   ACCEPT BARCODE
   ================================================= */

function acceptBarcode(value){

  if(!scanning){

    return;

  }


  currentValue=
    String(value);


  scanning=false;


  try{

    navigator.vibrate(150);

  }catch(e){}


  document
    .getElementById(
      'barcodeValue'
    )
    .textContent=
    currentValue;


  document
    .getElementById(
      'result'
    )
    .style
    .display=
    'block';


  document
    .getElementById(
      'status'
    )
    .textContent=
    '✅ Barcode successfully scanned.';


  document
    .getElementById(
      'scanInfo'
    )
    .textContent=
    '✅ Smart read confirmed';


  stopCameraOnly();

}


/* =================================================
   ZOOM SETUP
   ================================================= */

function setupZoom(){

  try{

    const scanner=
      document.getElementById(
        'scanner'
      );


    const video=
      scanner.querySelector(
        'video'
      );


    if(
      !video||
      !video.srcObject
    ){

      return;

    }


    const tracks=
      video.srcObject
        .getVideoTracks();


    if(!tracks.length){

      return;

    }


    const track=
      tracks[0];


    if(
      !track.getCapabilities
    ){

      return;

    }


    const capabilities=
      track.getCapabilities();


    if(
      capabilities.zoom
    ){

      hardwareZoomSupported=true;


      minZoom=
        Number(
          capabilities.zoom.min||1
        );


      maxZoom=
        Number(
          capabilities.zoom.max||1
        );


      currentZoom=
        Math.max(
          minZoom,
          Math.min(
            1,
            maxZoom
          )
        );

    }else{

      hardwareZoomSupported=false;

      minZoom=1;

      maxZoom=3;

      currentZoom=1;

    }


    updateZoomText();


  }catch(error){

    hardwareZoomSupported=false;

  }

}


/* =================================================
   ZOOM
   ================================================= */

async function changeZoom(amount){

  if(!scannerRunning){

    return;

  }


  if(
    hardwareZoomSupported
  ){

    try{

      let newZoom=
        currentZoom+amount;


      newZoom=
        Math.max(
          minZoom,
          Math.min(
            maxZoom,
            newZoom
          )
        );


      newZoom=
        Math.round(
          newZoom*10
        )/10;


      const video=
        document
          .getElementById(
            'scanner'
          )
          .querySelector(
            'video'
          );


      if(
        video&&
        video.srcObject
      ){

        const tracks=
          video.srcObject
            .getVideoTracks();


        if(tracks.length){

          await tracks[0]
            .applyConstraints({

              advanced:[
                {
                  zoom:newZoom
                }
              ]

            });


          currentZoom=
            newZoom;


          updateZoomText();

          return;

        }

      }

    }catch(error){

      console.log(
        'Hardware zoom:',
        error
      );

    }

  }


  /*
   * Digital fallback.
   */

  currentZoom+=amount;


  currentZoom=
    Math.max(
      1,
      Math.min(
        3,
        currentZoom
      )
    );


  currentZoom=
    Math.round(
      currentZoom*10
    )/10;


  const video=
    document
      .getElementById(
        'scanner'
      )
      .querySelector(
        'video'
      );


  if(video){

    video.style.transform=
      'scale('+
      currentZoom+
      ')';

  }


  updateZoomText();

}


/* =================================================
   ZOOM TEXT
   ================================================= */

function updateZoomText(){

  const element=
    document.getElementById(
      'zoomValue'
    );


  if(!element){

    return;

  }


  element.textContent=
    'Zoom '+
    currentZoom.toFixed(1)+
    '×';

}


/* =================================================
   STOP CAMERA
   ================================================= */

function stopCameraOnly(){

  try{

    if(scannerRunning){

      Quagga.stop();

    }

  }catch(e){}


  scannerRunning=false;


  const scanner=
    document.getElementById(
      'scanner'
    );


  const videos=
    scanner.querySelectorAll(
      'video'
    );


  videos.forEach(
    function(video){

      try{

        if(
          video.srcObject
        ){

          video.srcObject
            .getTracks()
            .forEach(
              function(track){

                track.stop();

              }
            );

        }


        video.style.transform=
          'scale(1)';

      }catch(e){}

    }
  );

}


/* =================================================
   STOP SCANNER
   ================================================= */

function stopScanner(){

  scanning=false;

  stopCameraOnly();


  currentValue='';

  candidateValue='';

  candidateFormat='';

  candidateCount=0;

  candidateTime=0;


  document
    .getElementById(
      'startBtn'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'stopBtn'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'result'
    )
    .style
    .display=
    'none';


  document
    .getElementById(
      'status'
    )
    .textContent=
    'Camera band ho gaya.';


  document
    .getElementById(
      'scanInfo'
    )
    .textContent=
    '🔎 Ready';


  currentZoom=1;

  hardwareZoomSupported=false;


  updateZoomText();

}


/* =================================================
   SCAN AGAIN
   ================================================= */

function scanAgain(){

  scanning=false;

  stopCameraOnly();


  currentValue='';

  candidateValue='';

  candidateFormat='';

  candidateCount=0;

  candidateTime=0;


  document
    .getElementById(
      'result'
    )
    .style
    .display=
    'none';


  currentZoom=1;

  hardwareZoomSupported=false;


  startScanner();

}


/* =================================================
   ACCEPT
   ================================================= */

function sendBarcodeBack(){

  if(!currentValue){

    return;

  }


  try{

    navigator.vibrate(100);

  }catch(e){}


  const params=
    new URLSearchParams(
      window.location.search
    );


  const returnUrl=
    params.get('return');


  /*
   * GitHub direct test.
   */

  if(!returnUrl){

    document
      .getElementById(
        'status'
      )
      .textContent=
      '✅ Accepted: '+
      currentValue;


    return;

  }


  const separator=
    returnUrl.includes('?')
      ? '&'
      : '?';


  window.location.href=
    returnUrl+
    separator+
    'barcode='+
    encodeURIComponent(
      currentValue
    );

}


/* =================================================
   AUTO START
   ================================================= */

function autoStartCamera(){

  setTimeout(
    function(){

      startScanner();

    },
    250
  );

}


if(
  document.readyState==='loading'
){

  document.addEventListener(
    'DOMContentLoaded',
    autoStartCamera
  );

}else{

  autoStartCamera();

}


/* =================================================
   BACK TO FORM
   ================================================= */

function backToForm(){

  try{

    scanning=false;

    stopCameraOnly();

  }catch(e){}


  const params=
    new URLSearchParams(
      window.location.search
    );


  const returnUrl=
    params.get('return');


  if(returnUrl){

    window.location.href=
      returnUrl;

    return;

  }


  /* Direct GitHub test: no return URL. */

  if(history.length>1){

    history.back();

  }

}


/* =================================================
   PAGE CLOSE
   ================================================= */

window.addEventListener(
  'pagehide',
  function(){

    scanning=false;

    stopCameraOnly();

  }
);


window.addEventListener(
  'beforeunload',
  function(){

    scanning=false;

    stopCameraOnly();

  }
);

</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>IMEI Scanner</title>

  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .header {
      background: #1976d2;
      padding: 18px 10px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 16px;
    }

    .title {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin: 8px 0 16px;
    }

    .status {
      background: #222;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 14px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
      font-size: 15px;
    }

    .video-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #333;
    }

    video {
      width: 100%;
      height: auto;
      min-height: 300px;
      max-height: 75vh;
      display: block;
      background: #000;
      object-fit: cover;
    }

    .scan-frame {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 32%;
      height: 36%;
      border: 3px solid #00ff55;
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 12px rgba(0,255,85,0.6);
    }

    .scan-line {
      position: absolute;
      left: 3%;
      right: 3%;
      top: 50%;
      height: 3px;
      background: #00ff55;
      box-shadow: 0 0 12px #00ff55;
    }

    .instruction {
      text-align: center;
      color: #ddd;
      font-size: 14px;
      line-height: 1.5;
      margin: 14px 0;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    .start {
      background: #16d95a;
      color: white;
    }

    .stop {
      background: #d32f2f;
      color: white;
    }

    .result {
      display: none;
      background: #1b5e20;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      margin-top: 16px;
    }

    .result-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .imei {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
      background: rgba(0,0,0,0.25);
      padding: 12px;
      border-radius: 8px;
    }

    .use-btn {
      background: white;
      color: #1b5e20;
    }

    .again-btn {
      background: #555;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .small-info {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="header">
    📷 IMEI SCANNER
  </div>

  <div class="container">

    <div class="title">
      Scan IMEI 1 Barcode
    </div>

    <div id="status" class="status">
      Camera start karne ke liye button dabayein.
    </div>

    <div class="video-box">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="scan-frame">
        <div class="scan-line"></div>
      </div>

    </div>

    <div class="instruction">
      📱 <b>IMEI 1</b> barcode ko green frame ke andar rakhein.
      <br>
      Barcode ko clear aur seedha rakhein.
      <br>
      Camera ko barcode se thoda paas/door karein.
    </div>

    <button
      id="startBtn"
      class="start"
      onclick="startScanner()">
      📷 START CAMERA
    </button>

    <button
      id="stopBtn"
      class="stop hidden"
      onclick="stopScanner()">
      ✕ STOP CAMERA
    </button>

    <div id="result" class="result">

      <div class="result-title">
        ✅ IMEI 1 SCANNED
      </div>

      <div id="imeiValue" class="imei"></div>

      <button
        class="use-btn"
        onclick="sendIMEIBack()">
        ✓ USE THIS IMEI
      </button>

      <button
        class="again-btn"
        onclick="scanAgain()">
        🔄 SCAN AGAIN
      </button>

    </div>

    <div class="small-info">
      Rear Camera • Barcode Scanner • IMEI Validation
    </div>

  </div>


<script>

  let codeReader = null;
  let controls = null;
  let currentIMEI = '';
  let scanning = false;


  async function startScanner() {

    const status =
      document.getElementById('status');

    const startBtn =
      document.getElementById('startBtn');

    const stopBtn =
      document.getElementById('stopBtn');

    const result =
      document.getElementById('result');

    try {

      scanning = true;

      currentIMEI = '';

      result.style.display = 'none';

      startBtn.classList.add('hidden');

      stopBtn.classList.remove('hidden');

      status.textContent =
        '📷 Camera starting...';


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          'Browser camera support nahi karta.'
        );

      }


      /*
       * IMPORTANT:
       * Ye wahi camera method hai jo
       * pehle tumhare phone par working tha.
       */

      const constraints = {

        video: {

          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          },

          frameRate: {
            ideal: 30
          }

        },

        audio: false

      };


      if (
        typeof ZXingBrowser === 'undefined'
      ) {

        throw new Error(
          'Barcode scanner library load nahi hui.'
        );

      }


      codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();


      controls =
        await codeReader.decodeFromConstraints(

          constraints,

          document.getElementById('video'),

          function(result, error) {

            if (!scanning) {
              return;
            }

            if (!result) {
              return;
            }


            const raw =
              result.getText();


            console.log(
              'Barcode detected:',
              raw
            );


            const imei =
              extractIMEI(raw);


            if (!imei) {

              status.textContent =
                '⚠️ 15 digit IMEI nahi mila. IMEI 1 barcode scan karein.';

              return;

            }


            if (!isValidIMEI(imei)) {

              status.textContent =
                '⚠️ IMEI invalid hai. Dobara scan karein.';

              return;

            }


            currentIMEI = imei;

            scanning = false;


            try {
              navigator.vibrate(200);
            } catch (e) {}


            document
              .getElementById('imeiValue')
              .textContent = imei;


            document
              .getElementById('result')
              .style
              .display = 'block';


            status.textContent =
              '✅ IMEI 1 successfully scanned.';


            stopCameraOnly();

          }

        );


      status.textContent =
        '✅ Camera ready — IMEI 1 barcode scan karein.';


    } catch (error) {

      console.error(
        'Camera error:',
        error
      );


      scanning = false;

      startBtn.classList.remove('hidden');

      stopBtn.classList.add('hidden');

      status.textContent =
        cameraError(error);

    }

  }


  function extractIMEI(text) {

    if (!text) {
      return null;
    }


    const value =
      String(text).trim();


    const match =
      value.match(/\d{15}/);


    if (match) {
      return match[0];
    }


    const digits =
      value.replace(/\D/g, '');


    if (digits.length === 15) {
      return digits;
    }


    if (digits.length > 15) {

      for (
        let i = 0;
        i <= digits.length - 15;
        i++
      ) {

        const candidate =
          digits.substring(
            i,
            i + 15
          );


        if (isValidIMEI(candidate)) {
          return candidate;
        }

      }

    }


    return null;

  }


  function isValidIMEI(imei) {

    imei =
      String(imei || '')
        .replace(/\D/g, '');


    if (imei.length !== 15) {
      return false;
    }


    let sum = 0;


    for (
      let i = 0;
      i < 15;
      i++
    ) {

      let digit =
        parseInt(
          imei.charAt(i),
          10
        );


      if (i % 2 === 1) {

        digit *= 2;

        if (digit > 9) {
          digit -= 9;
        }

      }


      sum += digit;

    }


    return sum % 10 === 0;

  }


  function stopCameraOnly() {

    try {

      if (controls) {
        controls.stop();
      }

    } catch (e) {}


    controls = null;


    const video =
      document.getElementById('video');


    try {

      if (video.srcObject) {

        video.srcObject
          .getTracks()
          .forEach(function(track) {

            track.stop();

          });

      }

      video.srcObject = null;

    } catch (e) {}

  }


  function stopScanner() {

    scanning = false;

    stopCameraOnly();


    if (codeReader) {

      try {
        codeReader.reset();
      } catch (e) {}

    }


    codeReader = null;

    currentIMEI = '';


    document
      .getElementById('startBtn')
      .classList
      .remove('hidden');


    document
      .getElementById('stopBtn')
      .classList
      .add('hidden');


    document
      .getElementById('result')
      .style
      .display = 'none';


    document
      .getElementById('status')
      .textContent =
      'Camera band ho gaya.';

  }


  function scanAgain() {

    stopCameraOnly();


    if (codeReader) {

      try {
        codeReader.reset();
      } catch (e) {}

    }


    codeReader = null;

    currentIMEI = '';

    scanning = false;


    document
      .getElementById('result')
      .style
      .display = 'none';


    startScanner();

  }


  function cameraError(error) {

    if (!error) {
      return '❌ Camera start nahi hua.';
    }


    const name =
      error.name || '';


    const message =
      error.message || '';


    if (
      name === 'NotAllowedError' ||
      name === 'PermissionDeniedError'
    ) {

      return '❌ Camera permission denied. Chrome mein Camera permission Allow karein.';

    }


    if (name === 'NotFoundError') {

      return '❌ Camera nahi mila.';

    }


    if (name === 'NotReadableError') {

      return '❌ Camera kisi doosri app mein use ho raha hai. Camera app band karein.';

    }


    return (
      '❌ Camera error: ' +
      name +
      (message ? ' — ' + message : '')
    );

  }


  function sendIMEIBack() {

    if (!currentIMEI) {
      return;
    }


    try {
      navigator.vibrate(100);
    } catch (e) {}


    const params =
      new URLSearchParams(
        window.location.search
      );


    const returnUrl =
      params.get('return');


    if (!returnUrl) {

      document
        .getElementById('status')
        .textContent =
        '✅ IMEI: ' + currentIMEI;

      return;

    }


    const separator =
      returnUrl.includes('?')
        ? '&'
        : '?';


    window.location.href =
      returnUrl +
      separator +
      'imei=' +
      encodeURIComponent(
        currentIMEI
      );

  }


  window.addEventListener(
    'pagehide',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


  window.addEventListener(
    'beforeunload',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );

</script>

</body>
</html>

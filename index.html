<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Barcode Scanner Test</title>

  <!-- QUAGGA2 -->
  <script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      background: #1976d2;
      padding: 18px 10px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .title {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin: 8px 0 16px;
    }

    .status {
      background: #222;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 14px;
      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 15px;
      line-height: 1.4;
    }

    #scanner {
      position: relative;
      width: 100%;
      height: 420px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #333;
    }

    #scanner video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #scanner canvas {
      position: absolute !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    .scan-frame {
      position: absolute;

      left: 5%;
      right: 5%;

      top: 28%;

      height: 44%;

      border: 3px solid #00ff55;

      border-radius: 12px;

      pointer-events: none;

      box-shadow:
        0 0 12px rgba(0,255,85,0.6);
    }

    .scan-line {
      position: absolute;

      left: 3%;
      right: 3%;

      top: 50%;

      height: 3px;

      background: #00ff55;

      box-shadow:
        0 0 12px #00ff55;
    }

    .instruction {
      text-align: center;
      color: #ddd;
      font-size: 14px;
      line-height: 1.5;
      margin: 14px 0;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    .start {
      background: #16d95a;
      color: white;
    }

    .stop {
      background: #d32f2f;
      color: white;
    }

    .result {
      display: none;

      background: #1b5e20;

      padding: 18px;

      border-radius: 12px;

      text-align: center;

      margin-top: 16px;
    }

    .result-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .barcode-value {
      font-size: 24px;

      font-weight: bold;

      letter-spacing: 1px;

      word-break: break-all;

      background: rgba(0,0,0,0.25);

      padding: 12px;

      border-radius: 8px;
    }

    .again-btn {
      background: #555;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .small-info {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 12px;
    }

  </style>

</head>


<body>


  <div class="header">
    📷 BARCODE SCANNER
  </div>


  <div class="container">


    <div class="title">
      Scan Any Barcode
    </div>


    <div
      id="status"
      class="status">

      Camera start karne ke liye button dabayein.

    </div>


    <div id="scanner">

      <div class="scan-frame">

        <div class="scan-line"></div>

      </div>

    </div>


    <div class="instruction">

      📱 Barcode ko green frame ke andar rakhein.

      <br>

      Barcode ko seedha aur clear rakhein.

      <br>

      <b>Abhi sirf barcode reading test hai.</b>

    </div>


    <button
      id="startBtn"
      class="start"
      onclick="startScanner()">

      📷 START CAMERA

    </button>


    <button
      id="stopBtn"
      class="stop hidden"
      onclick="stopScanner()">

      ✕ STOP CAMERA

    </button>


    <div
      id="result"
      class="result">

      <div class="result-title">

        ✅ BARCODE SCANNED

      </div>


      <div
        id="barcodeValue"
        class="barcode-value">
      </div>


      <button
        class="again-btn"
        onclick="scanAgain()">

        🔄 SCAN AGAIN

      </button>

    </div>


    <div class="small-info">

      Barcode Reading Test

    </div>


  </div>



<script>


  let scanning = false;

  let scannerRunning = false;

  let currentValue = '';



  /* =====================================================
     START
     ===================================================== */

  function startScanner() {


    const status =
      document.getElementById('status');


    const startBtn =
      document.getElementById('startBtn');


    const stopBtn =
      document.getElementById('stopBtn');


    const result =
      document.getElementById('result');


    try {


      if (
        typeof Quagga === 'undefined'
      ) {

        throw new Error(
          'Barcode scanner library load nahi hui.'
        );

      }


      scanning = true;

      scannerRunning = false;

      currentValue = '';


      result.style.display = 'none';


      startBtn.classList.add('hidden');

      stopBtn.classList.remove('hidden');


      status.textContent =
        '📷 Camera starting...';



      /*
       * =================================================
       * QUAGGA CONFIG
       * =================================================
       *
       * Camera:
       * Rear / Environment
       *
       * Readers:
       * Multiple common barcode types
       *
       * No IMEI restriction
       *
       * No 15 digit restriction
       */

      const config = {

        inputStream: {

          name: 'Live',

          type: 'LiveStream',

          target:
            document.getElementById('scanner'),

          constraints: {

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            }

          },

          area: {

            top: '20%',

            right: '5%',

            left: '5%',

            bottom: '20%'

          }

        },


        locator: {

          patchSize: 'medium',

          halfSample: false

        },


        numOfWorkers:
          navigator.hardwareConcurrency
            ? Math.min(
                4,
                navigator.hardwareConcurrency
              )
            : 2,


        frequency: 10,


        decoder: {

          readers: [

            {
              format: 'code_128_reader',
              config: {}
            },

            {
              format: 'code_39_reader',
              config: {}
            },

            {
              format: 'code_39_vin_reader',
              config: {}
            },

            {
              format: 'code_93_reader',
              config: {}
            },

            {
              format: 'ean_reader',
              config: {}
            },

            {
              format: 'ean_8_reader',
              config: {}
            },

            {
              format: 'upc_reader',
              config: {}
            },

            {
              format: 'upc_e_reader',
              config: {}
            },

            {
              format: 'codabar_reader',
              config: {}
            },

            {
              format: 'i2of5_reader',
              config: {}
            },

            {
              format: '2of5_reader',
              config: {}
            }

          ]

        },


        locate: true,

        debug: false

      };



      Quagga.init(
        config,
        function(error) {


          if (error) {

            console.error(
              'QUAGGA INIT ERROR:',
              error
            );


            scanning = false;

            startBtn.classList.remove(
              'hidden'
            );

            stopBtn.classList.add(
              'hidden'
            );


            status.textContent =
              '❌ Camera start nahi hua: ' +
              (
                error.message ||
                error
              );

            return;

          }



          /*
           * Camera successfully started
           */

          Quagga.start();

          scannerRunning = true;


          status.textContent =
            '✅ Camera ready — barcode scan karein.';


          console.log(
            'Quagga camera started.'
          );


        }
      );


    } catch (error) {


      console.error(
        'START ERROR:',
        error
      );


      scanning = false;


      startBtn.classList.remove(
        'hidden'
      );


      stopBtn.classList.add(
        'hidden'
      );


      status.textContent =
        '❌ ' +
        (
          error.message ||
          error
        );

    }

  }



  /* =====================================================
     BARCODE DETECTED
     ===================================================== */

  Quagga.onDetected(
    function(result) {


      if (!scanning) {
        return;
      }


      if (!result) {
        return;
      }


      if (!result.codeResult) {
        return;
      }


      const code =
        result.codeResult.code;


      if (!code) {
        return;
      }


      console.log(
        'BARCODE DETECTED:',
        code
      );


      /*
       * FIRST SUCCESSFUL READ
       *
       * No validation.
       * No 15 digit check.
       * No IMEI check.
       *
       * Jo mila wahi dikhao.
       */

      currentValue =
        String(code);


      scanning = false;



      try {
        navigator.vibrate(200);
      } catch (e) {}



      document
        .getElementById('barcodeValue')
        .textContent =
        currentValue;


      document
        .getElementById('result')
        .style
        .display = 'block';


      document
        .getElementById('status')
        .textContent =
        '✅ Barcode successfully read.';


      stopCameraOnly();


    }
  );



  /* =====================================================
     STOP CAMERA
     ===================================================== */

  function stopCameraOnly() {


    try {

      if (scannerRunning) {

        Quagga.stop();

      }

    } catch (e) {}


    scannerRunning = false;


    /*
     * Remove camera video if possible
     */

    const scanner =
      document.getElementById('scanner');


    const videos =
      scanner.querySelectorAll(
        'video'
      );


    videos.forEach(
      function(video) {

        try {

          if (video.srcObject) {

            video.srcObject
              .getTracks()
              .forEach(
                function(track) {

                  track.stop();

                }
              );

          }

        } catch (e) {}

      }
    );

  }



  /* =====================================================
     STOP BUTTON
     ===================================================== */

  function stopScanner() {


    scanning = false;


    stopCameraOnly();


    currentValue = '';


    document
      .getElementById('startBtn')
      .classList
      .remove('hidden');


    document
      .getElementById('stopBtn')
      .classList
      .add('hidden');


    document
      .getElementById('result')
      .style
      .display = 'none';


    document
      .getElementById('status')
      .textContent =
      'Camera band ho gaya.';

  }



  /* =====================================================
     SCAN AGAIN
     ===================================================== */

  function scanAgain() {


    scanning = false;


    stopCameraOnly();


    currentValue = '';


    document
      .getElementById('result')
      .style
      .display = 'none';


    startScanner();

  }



  /* =====================================================
     PAGE CLOSE
     ===================================================== */

  window.addEventListener(
    'pagehide',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


  window.addEventListener(
    'beforeunload',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>IMEI Scanner</title>

  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .header {
      background: #1976d2;
      padding: 18px 10px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .title {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin: 8px 0 16px;
    }

    .status {
      background: #222;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 14px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
      font-size: 15px;
    }

    .video-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #333;
    }

    video {
      width: 100%;
      height: auto;
      min-height: 300px;
      max-height: 75vh;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .scan-frame {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 30%;
      height: 40%;
      border: 3px solid #00ff55;
      border-radius: 12px;
      pointer-events: none;
      box-shadow:
        0 0 12px rgba(0,255,85,0.7);
    }

    .scan-line {
      position: absolute;
      left: 3%;
      right: 3%;
      top: 50%;
      height: 3px;
      background: #00ff55;
      box-shadow: 0 0 12px #00ff55;
    }

    .instruction {
      text-align: center;
      color: #ddd;
      font-size: 14px;
      line-height: 1.5;
      margin: 14px 0;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    .start {
      background: #16d95a;
      color: white;
    }

    .stop {
      background: #d32f2f;
      color: white;
    }

    .zoom-area {
      display: none;
      background: #222;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }

    .zoom-title {
      text-align: center;
      font-size: 14px;
      color: #ddd;
      margin-bottom: 8px;
    }

    .zoom-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .zoom-btn {
      background: #444;
      color: white;
      padding: 11px 5px;
      font-size: 15px;
    }

    .zoom-btn.active {
      background: #1976d2;
    }

    .zoom-btn:disabled {
      opacity: 0.35;
    }

    .result {
      display: none;
      background: #1b5e20;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      margin-top: 16px;
    }

    .result-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .imei {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
      background: rgba(0,0,0,0.25);
      padding: 12px;
      border-radius: 8px;
    }

    .use-btn {
      background: white;
      color: #1b5e20;
    }

    .again-btn {
      background: #555;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .small-info {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 12px;
    }

  </style>

</head>


<body>


  <div class="header">
    📷 IMEI SCANNER
  </div>


  <div class="container">

    <div class="title">
      Scan IMEI 1 Barcode
    </div>


    <div
      id="status"
      class="status">

      Camera start karne ke liye
      button dabayein.

    </div>


    <div class="video-box">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="scan-frame">

        <div class="scan-line"></div>

      </div>

    </div>


    <div class="instruction">

      📱 <b>IMEI 1</b> barcode ko
      green frame ke andar rakhein.

      <br>

      Barcode clear hone dein.

    </div>


    <button
      id="startBtn"
      class="start"
      onclick="startScanner()">

      📷 START CAMERA

    </button>


    <button
      id="stopBtn"
      class="stop hidden"
      onclick="stopScanner()">

      ✕ STOP CAMERA

    </button>


    <div
      id="zoomArea"
      class="zoom-area">

      <div class="zoom-title">
        🔍 Camera Zoom
      </div>

      <div class="zoom-buttons">

        <button
          id="zoom1"
          class="zoom-btn"
          onclick="setZoom(1)">

          1×

        </button>

        <button
          id="zoom2"
          class="zoom-btn"
          onclick="setZoom(2)">

          2×

        </button>

        <button
          id="zoom3"
          class="zoom-btn"
          onclick="setZoom(3)">

          3×

        </button>

      </div>

    </div>


    <div
      id="result"
      class="result">

      <div class="result-title">
        ✅ IMEI 1 SCANNED
      </div>

      <div
        id="imeiValue"
        class="imei">
      </div>


      <button
        class="use-btn"
        onclick="sendIMEIBack()">

        ✓ USE THIS IMEI

      </button>


      <button
        class="again-btn"
        onclick="scanAgain()">

        🔄 SCAN AGAIN

      </button>

    </div>


    <div class="small-info">

      High quality camera •
      Auto focus •
      Smart zoom •
      IMEI validation

    </div>

  </div>



<script>


  let codeReader = null;

  let controls = null;

  let cameraStream = null;

  let videoTrack = null;

  let currentIMEI = '';

  let maxZoom = 1;

  let currentZoom = 1;

  let scanning = false;



  /*
   * START CAMERA + SCANNER
   */

  async function startScanner() {

    const status =
      document.getElementById('status');

    const startBtn =
      document.getElementById('startBtn');

    const stopBtn =
      document.getElementById('stopBtn');

    const zoomArea =
      document.getElementById('zoomArea');

    const result =
      document.getElementById('result');


    try {

      scanning = true;

      currentIMEI = '';

      result.style.display = 'none';

      startBtn.classList.add('hidden');

      stopBtn.classList.remove('hidden');

      status.textContent =
        '📷 Camera starting...';


      /*
       * Check browser support
       */

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          'Browser camera support nahi karta.'
        );

      }


      /*
       * First try:
       * rear camera + HD
       */

      let stream;


      try {

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              facingMode: {
                ideal: 'environment'
              },

              width: {
                ideal: 1920
              },

              height: {
                ideal: 1080
              },

              frameRate: {
                ideal: 30
              }

            },

            audio: false

          });

      } catch (firstError) {

        console.log(
          'HD camera request failed:',
          firstError
        );


        /*
         * Fallback:
         * simple rear camera
         */

        try {

          stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: 'environment'
              },

              audio: false

            });

        } catch (secondError) {

          console.log(
            'Rear camera request failed:',
            secondError
          );


          /*
           * Final fallback:
           * any available camera
           */

          stream =
            await navigator.mediaDevices.getUserMedia({

              video: true,

              audio: false

            });

        }

      }


      cameraStream = stream;


      /*
       * Put stream into video
       */

      const video =
        document.getElementById('video');


      video.srcObject =
        stream;


      await video.play();


      /*
       * Get camera track
       */

      const tracks =
        stream.getVideoTracks();


      if (tracks.length > 0) {

        videoTrack =
          tracks[0];

        console.log(
          'Camera:',
          videoTrack.label
        );

        console.log(
          'Camera settings:',
          videoTrack.getSettings()
        );

      }


      /*
       * Safely improve camera
       */

      await improveCamera();


      /*
       * Start ZXing using the
       * already-running camera stream
       */

      if (
        typeof ZXingBrowser === 'undefined'
      ) {

        throw new Error(
          'Barcode scanner library load nahi hui.'
        );

      }


      codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();


      status.textContent =
        '🔍 Barcode scanner starting...';


      controls =
        await codeReader.decodeFromStream(

          stream,

          video,

          function(result, error) {

            if (!scanning) {
              return;
            }


            if (!result) {
              return;
            }


            const raw =
              result.getText();


            console.log(
              'Barcode:',
              raw
            );


            const imei =
              extractIMEI(raw);


            if (!imei) {

              status.textContent =
                '⚠️ 15 digit IMEI nahi mila. IMEI 1 barcode scan karein.';

              return;

            }


            if (!isValidIMEI(imei)) {

              status.textContent =
                '⚠️ IMEI invalid hai. Dobara scan karein.';

              return;

            }


            /*
             * SUCCESS
             */

            currentIMEI =
              imei;

            scanning =
              false;


            try {

              navigator.vibrate(200);

            } catch (e) {}


            document
              .getElementById('imeiValue')
              .textContent =
              imei;


            document
              .getElementById('result')
              .style.display =
              'block';


            status.textContent =
              '✅ IMEI 1 successfully scanned.';


            stopCameraOnly();

          }

        );


      zoomArea.style.display =
        'block';


      setupZoom();


      status.textContent =
        '✅ Camera ready — IMEI 1 barcode scan karein.';


    } catch (error) {

      console.error(
        'CAMERA ERROR:',
        error
      );


      scanning =
        false;


      startBtn.classList.remove('hidden');

      stopBtn.classList.add('hidden');

      zoomArea.style.display =
        'none';


      status.textContent =
        cameraError(error);

    }

  }



  /*
   * Improve camera AFTER it starts
   */

  async function improveCamera() {

    if (!videoTrack) {
      return;
    }


    try {

      const capabilities =
        videoTrack.getCapabilities
          ? videoTrack.getCapabilities()
          : {};


      console.log(
        'Capabilities:',
        capabilities
      );


      /*
       * Autofocus
       */

      if (
        capabilities.focusMode &&
        capabilities.focusMode.includes('continuous')
      ) {

        try {

          await videoTrack.applyConstraints({

            advanced: [

              {
                focusMode: 'continuous'
              }

            ]

          });

        } catch (focusError) {

          console.log(
            'Autofocus not available:',
            focusError
          );

        }

      }


      /*
       * Zoom
       */

      if (capabilities.zoom) {

        const min =
          capabilities.zoom.min || 1;

        const max =
          capabilities.zoom.max || 1;


        maxZoom =
          max;


        const preferred =
          Math.min(
            Math.max(1.5, min),
            max
          );


        if (
          preferred > min
        ) {

          try {

            await videoTrack.applyConstraints({

              advanced: [

                {
                  zoom: preferred
                }

              ]

            });


            currentZoom =
              preferred;

          } catch (zoomError) {

            console.log(
              'Auto zoom unavailable:',
              zoomError
            );

          }

        }

      }

    } catch (error) {

      console.log(
        'Camera improvement skipped:',
        error
      );

    }

  }



  /*
   * Setup zoom buttons
   */

  function setupZoom() {

    const zoom1 =
      document.getElementById('zoom1');

    const zoom2 =
      document.getElementById('zoom2');

    const zoom3 =
      document.getElementById('zoom3');


    zoom1.disabled =
      false;


    zoom2.disabled =
      maxZoom < 2;


    zoom3.disabled =
      maxZoom < 3;


    updateZoomButtons();

  }



  /*
   * Set zoom
   */

  async function setZoom(level) {

    if (!videoTrack) {
      return;
    }


    const capabilities =
      videoTrack.getCapabilities
        ? videoTrack.getCapabilities()
        : {};


    if (!capabilities.zoom) {

      document
        .getElementById('status')
        .textContent =
        'ℹ️ Is phone/browser mein manual zoom available nahi hai.';

      return;

    }


    const min =
      capabilities.zoom.min || 1;

    const max =
      capabilities.zoom.max || 1;


    const target =
      Math.min(
        Math.max(level, min),
        max
      );


    try {

      await videoTrack.applyConstraints({

        advanced: [

          {
            zoom: target
          }

        ]

      });


      currentZoom =
        target;


      updateZoomButtons();


    } catch (error) {

      console.log(
        'Zoom error:',
        error
      );

    }

  }



  /*
   * Zoom button UI
   */

  function updateZoomButtons() {

    document
      .getElementById('zoom1')
      .classList.remove('active');

    document
      .getElementById('zoom2')
      .classList.remove('active');

    document
      .getElementById('zoom3')
      .classList.remove('active');


    if (currentZoom < 1.5) {

      document
        .getElementById('zoom1')
        .classList.add('active');

    } else if (currentZoom < 2.5) {

      document
        .getElementById('zoom2')
        .classList.add('active');

    } else {

      document
        .getElementById('zoom3')
        .classList.add('active');

    }

  }



  /*
   * Extract 15 digit IMEI
   */

  function extractIMEI(text) {

    if (!text) {
      return null;
    }


    const value =
      String(text);


    /*
     * Direct 15 digits
     */

    const direct =
      value.match(/\d{15}/);


    if (direct) {

      return direct[0];

    }


    /*
     * Remove separators
     */

    const digits =
      value.replace(/\D/g, '');


    if (digits.length === 15) {

      return digits;

    }


    return null;

  }



  /*
   * IMEI Luhn validation
   */

  function isValidIMEI(imei) {

    imei =
      String(imei || '')
        .replace(/\D/g, '');


    if (imei.length !== 15) {

      return false;

    }


    let sum = 0;


    for (
      let i = 0;
      i < 15;
      i++
    ) {

      let digit =
        parseInt(
          imei.charAt(i),
          10
        );


      if (i % 2 === 1) {

        digit *= 2;


        if (digit > 9) {

          digit -= 9;

        }

      }


      sum += digit;

    }


    return (
      sum % 10 === 0
    );

  }



  /*
   * Stop camera only
   */

  function stopCameraOnly() {

    try {

      if (controls) {

        controls.stop();

      }

    } catch (e) {}


    controls =
      null;


    if (cameraStream) {

      try {

        cameraStream
          .getTracks()
          .forEach(function(track) {

            track.stop();

          });

      } catch (e) {}

    }


    cameraStream =
      null;

    videoTrack =
      null;


    const video =
      document.getElementById('video');


    try {

      video.srcObject =
        null;

    } catch (e) {}

  }



  /*
   * Stop everything
   */

  function stopScanner() {

    scanning =
      false;


    stopCameraOnly();


    if (codeReader) {

      try {

        codeReader.reset();

      } catch (e) {}

    }


    codeReader =
      null;


    currentIMEI =
      '';


    currentZoom =
      1;

    maxZoom =
      1;


    document
      .getElementById('startBtn')
      .classList.remove('hidden');


    document
      .getElementById('stopBtn')
      .classList.add('hidden');


    document
      .getElementById('zoomArea')
      .style.display =
      'none';


    document
      .getElementById('result')
      .style.display =
      'none';


    document
      .getElementById('status')
      .textContent =
      'Camera band ho gaya.';

  }



  /*
   * Scan again
   */

  function scanAgain() {

    stopCameraOnly();


    if (codeReader) {

      try {

        codeReader.reset();

      } catch (e) {}

    }


    codeReader =
      null;


    currentIMEI =
      '';


    document
      .getElementById('result')
      .style.display =
      'none';


    startScanner();

  }



  /*
   * Better camera error
   */

  function cameraError(error) {

    console.error(
      'Detailed error:',
      error
    );


    if (!error) {

      return (
        '❌ Camera start nahi hua. Dobara try karein.'
      );

    }


    const name =
      error.name || '';


    const message =
      error.message || '';


    if (
      name === 'NotAllowedError' ||
      name === 'PermissionDeniedError'
    ) {

      return (
        '❌ Camera permission denied. ' +
        'Chrome mein Camera → Allow karein.'
      );

    }


    if (
      name === 'NotFoundError'
    ) {

      return (
        '❌ Camera nahi mila.'
      );

    }


    if (
      name === 'NotReadableError'
    ) {

      return (
        '❌ Camera kisi doosri app mein use ho raha hai. ' +
        'Camera app band karein.'
      );

    }


    if (
      name === 'OverconstrainedError'
    ) {

      return (
        '❌ Requested camera quality available nahi hai. ' +
        'Fallback camera try nahi ho saka.'
      );

    }


    return (
      '❌ Camera error: ' +
      name +
      (message ? ' — ' + message : '')
    );

  }



  /*
   * Send IMEI back to Invoice app
   */

  function sendIMEIBack() {

    if (!currentIMEI) {

      return;

    }


    try {

      navigator.vibrate(100);

    } catch (e) {}


    const params =
      new URLSearchParams(
        window.location.search
      );


    const returnUrl =
      params.get('return');


    if (!returnUrl) {

      document
        .getElementById('status')
        .textContent =
        '✅ IMEI: ' +
        currentIMEI;

      return;

    }


    const separator =
      returnUrl.includes('?')
        ? '&'
        : '?';


    window.location.href =
      returnUrl +
      separator +
      'imei=' +
      encodeURIComponent(
        currentIMEI
      );

  }


</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Barcode Scanner</title>

  <script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

    }


    body {

      display: flex;

      flex-direction: column;

    }


    /* =========================
       HEADER
       ========================= */

    .header {

      flex: 0 0 auto;

      background: #1976d2;

      padding: 10px 8px;

      text-align: center;

      font-size: 20px;

      font-weight: bold;

    }


    /* =========================
       MAIN CONTAINER
       ========================= */

    .container {

      width: 100%;

      max-width: 650px;

      margin: 0 auto;

      padding: 7px 10px;

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;

    }


    /* =========================
       TITLE
       ========================= */

    .title {

      flex: 0 0 auto;

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      margin: 2px 0 6px;

    }


    /* =========================
       STATUS
       ========================= */

    .status {

      flex: 0 0 auto;

      background: #222;

      border-radius: 8px;

      padding: 7px;

      text-align: center;

      min-height: 35px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 13px;

      line-height: 1.2;

      margin-bottom: 6px;

    }


    /* =========================
       CAMERA
       ========================= */

    #scanner {

      position: relative;

      width: 100%;

      height: 210px;

      flex: 0 0 210px;

      background: #000;

      border-radius: 11px;

      overflow: hidden;

      border: 2px solid #333;

    }


    #scanner video {

      width: 100% !important;

      height: 100% !important;

      object-fit: cover;

      display: block;

    }


    #scanner canvas {

      position: absolute !important;

      top: 0 !important;

      left: 0 !important;

      width: 100% !important;

      height: 100% !important;

      pointer-events: none;

    }


    /* =========================
       GREEN FRAME
       ========================= */

    .scan-frame {

      position: absolute;

      left: 6%;

      right: 6%;

      top: 27%;

      height: 46%;

      border: 3px solid #00ff55;

      border-radius: 10px;

      pointer-events: none;

      box-shadow:
        0 0 10px rgba(0,255,85,0.7);

    }


    .scan-line {

      position: absolute;

      left: 3%;

      right: 3%;

      top: 50%;

      height: 2px;

      background: #00ff55;

      box-shadow:
        0 0 10px #00ff55;

    }


    /* =========================
       ZOOM
       ========================= */

    .zoom-row {

      flex: 0 0 auto;

      height: 39px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      margin-top: 5px;

    }


    .zoom-btn {

      width: 58px;

      height: 36px;

      padding: 0;

      margin: 0;

      border-radius: 8px;

      border: 1px solid #555;

      background: #333;

      color: white;

      font-size: 23px;

      font-weight: bold;

    }


    .zoom-value {

      width: 75px;

      text-align: center;

      font-size: 13px;

      color: #ddd;

      font-weight: bold;

    }


    /* =========================
       INSTRUCTION
       ========================= */

    .instruction {

      flex: 0 0 auto;

      text-align: center;

      color: #ccc;

      font-size: 11px;

      line-height: 1.2;

      margin: 4px 0;

    }


    /* =========================
       SCAN INFO
       ========================= */

    .scan-info {

      flex: 0 0 auto;

      text-align: center;

      color: #aaa;

      font-size: 11px;

      min-height: 14px;

      margin: 2px 0;

    }


    /* =========================
       BUTTONS
       ========================= */

    button {

      border: none;

      cursor: pointer;

      touch-action: manipulation;

      font-weight: bold;

    }


    button:active {

      transform: scale(0.97);

    }


    .main-btn {

      width: 100%;

      height: 43px;

      flex: 0 0 43px;

      border-radius: 9px;

      font-size: 16px;

      margin-top: 3px;

    }


    .start {

      background: #16d95a;

      color: white;

    }


    .stop {

      background: #d32f2f;

      color: white;

    }


    /* =========================
       RESULT
       ========================= */

    .result {

      display: none;

      flex: 0 0 auto;

      background: #1b5e20;

      padding: 9px;

      border-radius: 10px;

      text-align: center;

      margin-top: 5px;

    }


    .result-title {

      font-size: 15px;

      font-weight: bold;

      margin-bottom: 5px;

    }


    .barcode-value {

      font-size: 21px;

      font-weight: bold;

      letter-spacing: 0.5px;

      word-break: break-all;

      background: rgba(0,0,0,0.25);

      padding: 8px;

      border-radius: 7px;

      max-height: 58px;

      overflow: hidden;

    }


    .use-btn {

      width: 100%;

      height: 39px;

      margin-top: 6px;

      border-radius: 8px;

      background: white;

      color: #1b5e20;

      font-size: 15px;

    }


    .again-btn {

      width: 100%;

      height: 39px;

      margin-top: 5px;

      border-radius: 8px;

      background: #555;

      color: white;

      font-size: 15px;

    }


    .hidden {

      display: none !important;

    }


    .small-info {

      flex: 0 0 auto;

      text-align: center;

      color: #666;

      font-size: 9px;

      margin-top: 3px;

    }


    /* =========================
       SMALL PHONES
       ========================= */

    @media (max-height: 700px) {

      .header {

        padding: 8px;

        font-size: 18px;

      }


      .container {

        padding-top: 5px;

      }


      .title {

        font-size: 16px;

        margin-bottom: 4px;

      }


      #scanner {

        height: 180px;

        flex-basis: 180px;

      }


      .zoom-row {

        height: 34px;

      }


      .zoom-btn {

        height: 32px;

      }


      .instruction {

        font-size: 10px;

      }


      .main-btn {

        height: 39px;

        flex-basis: 39px;

        font-size: 15px;

      }


      .result {

        padding: 7px;

      }


      .barcode-value {

        font-size: 19px;

      }

    }

  </style>

</head>


<body>


  <div class="header">

    📷 BARCODE SCANNER

  </div>


  <div class="container">


    <div class="title">

      Scan Barcode

    </div>


    <div
      id="status"
      class="status">

      Camera start karne ke liye button dabayein.

    </div>


    <!-- CAMERA -->

    <div id="scanner">


      <div class="scan-frame">

        <div class="scan-line"></div>

      </div>


    </div>


    <!-- ZOOM -->

    <div class="zoom-row">


      <button
        class="zoom-btn"
        onclick="changeZoom(-0.5)">

        −

      </button>


      <div
        id="zoomValue"
        class="zoom-value">

        Zoom 1.0×

      </div>


      <button
        class="zoom-btn"
        onclick="changeZoom(0.5)">

        +

      </button>


    </div>


    <div class="instruction">

      Barcode ko green frame mein rakhein.

      <br>

      Number ya alphabet — kuch bhi scan kar sakte hain.

    </div>


    <div
      id="scanInfo"
      class="scan-info">

      🔎 Ready

    </div>


    <!-- START -->

    <button
      id="startBtn"
      class="main-btn start"
      onclick="startScanner()">

      📷 START CAMERA

    </button>


    <!-- STOP -->

    <button
      id="stopBtn"
      class="main-btn stop hidden"
      onclick="stopScanner()">

      ✕ STOP CAMERA

    </button>


    <!-- RESULT -->

    <div
      id="result"
      class="result">


      <div class="result-title">

        ✅ BARCODE SCANNED

      </div>


      <div
        id="barcodeValue"
        class="barcode-value">

      </div>


      <button
        class="use-btn"
        onclick="sendBarcodeBack()">

        ✓ USE THIS VALUE

      </button>


      <button
        class="again-btn"
        onclick="scanAgain()">

        🔄 SCAN AGAIN

      </button>


    </div>


    <div class="small-info">

      Any Barcode • Any Text • Any Serial

    </div>


  </div>



<script>


  let scanning = false;

  let scannerRunning = false;

  let currentValue = '';


  /*
   * Same barcode ko 2 baar confirm karenge.
   * Isse random one-frame reading kam hogi.
   */

  let candidateValue = '';

  let candidateCount = 0;


  /*
   * ZOOM
   */

  let currentZoom = 1;

  let minZoom = 1;

  let maxZoom = 1;

  let hardwareZoomSupported = false;



  /* =====================================================
     START SCANNER
     ===================================================== */

  function startScanner() {


    const status =
      document.getElementById('status');


    const startBtn =
      document.getElementById('startBtn');


    const stopBtn =
      document.getElementById('stopBtn');


    const result =
      document.getElementById('result');


    const scanInfo =
      document.getElementById('scanInfo');


    try {


      if (
        typeof Quagga === 'undefined'
      ) {

        throw new Error(
          'Barcode scanner library load nahi hui.'
        );

      }


      scanning = true;

      scannerRunning = false;

      currentValue = '';

      candidateValue = '';

      candidateCount = 0;

      currentZoom = 1;


      result.style.display = 'none';


      startBtn.classList.add(
        'hidden'
      );


      stopBtn.classList.remove(
        'hidden'
      );


      status.textContent =
        '📷 Camera starting...';


      scanInfo.textContent =
        '🔎 Barcode searching...';



      /*
       * CAMERA
       *
       * Same working camera settings.
       */

      const config = {


        inputStream: {

          name: 'Live',

          type: 'LiveStream',

          target:
            document.getElementById(
              'scanner'
            ),


          constraints: {

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            }

          },


          /*
           * Central scanning area.
           */

          area: {

            top: '28%',

            right: '6%',

            left: '6%',

            bottom: '45%'

          }

        },


        /*
         * Barcode locator.
         */

        locator: {

          patchSize: 'medium',

          halfSample: false

        },


        numOfWorkers:
          navigator.hardwareConcurrency
            ? Math.min(
                4,
                navigator.hardwareConcurrency
              )
            : 2,


        frequency: 10,


        /*
         * IMPORTANT:
         *
         * Multiple common barcode readers.
         *
         * FINAL RESULT PAR koi
         * numeric/IMEI restriction nahi hai.
         */

        decoder: {

          readers: [

            {
              format: 'code_128_reader',
              config: {}
            },

            {
              format: 'code_39_reader',
              config: {}
            },

            {
              format: 'code_39_vin_reader',
              config: {}
            },

            {
              format: 'code_93_reader',
              config: {}
            },

            {
              format: 'ean_reader',
              config: {}
            },

            {
              format: 'ean_8_reader',
              config: {}
            },

            {
              format: 'upc_reader',
              config: {}
            },

            {
              format: 'upc_e_reader',
              config: {}
            },

            {
              format: 'codabar_reader',
              config: {}
            },

            {
              format: 'i2of5_reader',
              config: {}
            },

            {
              format: '2of5_reader',
              config: {}
            }

          ]

        },


        locate: true,

        debug: false

      };



      /*
       * START
       */

      Quagga.init(

        config,

        function(error) {


          if (error) {


            console.error(
              'QUAGGA ERROR:',
              error
            );


            scanning = false;


            startBtn.classList.remove(
              'hidden'
            );


            stopBtn.classList.add(
              'hidden'
            );


            status.textContent =
              '❌ Camera start nahi hua: ' +
              (
                error.message ||
                error
              );


            return;

          }


          /*
           * CAMERA START
           */

          Quagga.start();

          scannerRunning = true;


          status.textContent =
            '✅ Camera ready — barcode green frame mein rakhein.';


          scanInfo.textContent =
            '🔎 Any barcode searching...';


          /*
           * Camera ke actual zoom
           * capabilities check karo.
           */

          setTimeout(
            setupZoom,
            700
          );


        }

      );


    } catch (error) {


      console.error(
        'START ERROR:',
        error
      );


      scanning = false;


      startBtn.classList.remove(
        'hidden'
      );


      stopBtn.classList.add(
        'hidden'
      );


      status.textContent =
        '❌ ' +
        (
          error.message ||
          error
        );

    }

  }



  /* =====================================================
     SETUP HARDWARE ZOOM
     ===================================================== */

  function setupZoom() {


    try {


      const scanner =
        document.getElementById(
          'scanner'
        );


      const video =
        scanner.querySelector(
          'video'
        );


      if (
        !video ||
        !video.srcObject
      ) {

        hardwareZoomSupported = false;

        updateZoomText();

        return;

      }


      const tracks =
        video.srcObject.getVideoTracks();


      if (
        !tracks ||
        !tracks.length
      ) {

        hardwareZoomSupported = false;

        updateZoomText();

        return;

      }


      const track =
        tracks[0];


      if (
        !track.getCapabilities
      ) {

        hardwareZoomSupported = false;

        updateZoomText();

        return;

      }


      const capabilities =
        track.getCapabilities();


      if (
        capabilities &&
        capabilities.zoom
      {


        hardwareZoomSupported = true;


        minZoom =
          Number(
            capabilities.zoom.min || 1
          );


        maxZoom =
          Number(
            capabilities.zoom.max || 1
          );


        currentZoom =
          Math.max(
            minZoom,
            Math.min(
              1,
              maxZoom
            )
          );


        updateZoomText();


      } else {


        hardwareZoomSupported = false;

        minZoom = 1;

        maxZoom = 1;

        currentZoom = 1;


        updateZoomText();

      }


    } catch (error) {


      console.log(
        'Zoom setup error:',
        error
      );


      hardwareZoomSupported = false;

      updateZoomText();

    }

  }



  /* =====================================================
     CHANGE ZOOM
     ===================================================== */

  async function changeZoom(amount) {


    if (!scannerRunning) {

      return;

    }


    /*
     * Hardware zoom available
     */

    if (hardwareZoomSupported) {


      try {


        let newZoom =
          currentZoom + amount;


        newZoom =
          Math.max(
            minZoom,
            Math.min(
              maxZoom,
              newZoom
            )
          );


        newZoom =
          Math.round(
            newZoom * 10
          ) / 10;


        const scanner =
          document.getElementById(
            'scanner'
          );


        const video =
          scanner.querySelector(
            'video'
          );


        if (
          video &&
          video.srcObject
        ) {


          const tracks =
            video.srcObject.getVideoTracks();


          if (
            tracks.length
          ) {


            await tracks[0]
              .applyConstraints({

                advanced: [

                  {
                    zoom: newZoom
                  }

                ]

              });


            currentZoom =
              newZoom;


            updateZoomText();

            return;

          }

        }


      } catch (error) {


        console.log(
          'Hardware zoom error:',
          error
        );

      }

    }


    /*
     * Agar hardware zoom available nahi hai,
     * visual digital zoom use karenge.
     */

    currentZoom += amount;


    currentZoom =
      Math.max(
        1,
        Math.min(
          3,
          currentZoom
        )
      );


    currentZoom =
      Math.round(
        currentZoom * 10
      ) / 10;


    applyDigitalZoom();


    updateZoomText();

  }



  /* =====================================================
     DIGITAL ZOOM
     ===================================================== */

  function applyDigitalZoom() {


    const scanner =
      document.getElementById(
        'scanner'
      );


    const video =
      scanner.querySelector(
        'video'
      );


    if (!video) {
      return;
    }


    /*
     * Visual zoom only.
     *
     * Camera hardware zoom preferred.
     */

    if (!hardwareZoomSupported) {

      video.style.transform =
        'scale(' +
        currentZoom +
        ')';

    }

  }



  /* =====================================================
     ZOOM TEXT
     ===================================================== */

  function updateZoomText() {


    const element =
      document.getElementById(
        'zoomValue'
      );


    if (!element) {
      return;
    }


    element.textContent =
      'Zoom ' +
      currentZoom.toFixed(1) +
      '×';

  }



  /* =====================================================
     BARCODE DETECTED
     ===================================================== */

  Quagga.onDetected(

    function(result) {


      if (!scanning) {
        return;
      }


      if (!result) {
        return;
      }


      if (!result.codeResult) {
        return;
      }


      const code =
        result.codeResult.code;


      if (
        code === undefined ||
        code === null
      ) {

        return;

      }


      const value =
        String(code).trim();


      /*
       * Empty barcode ignore.
       */

      if (!value) {
        return;
      }


      console.log(
        'BARCODE FOUND:',
        value
      );


      /*
       * Same value confirmation.
       *
       * Koi bhi value allowed hai.
       */

      if (
        candidateValue === value
      ) {

        candidateCount++;

      } else {

        candidateValue = value;

        candidateCount = 1;

      }


      document
        .getElementById(
          'scanInfo'
        )
        .textContent =
        '🔎 Barcode found — confirming ' +
        candidateCount +
        '/2';



      /*
       * Same value 2 baar mil gaya.
       */

      if (
        candidateCount >= 2
      ) {

        acceptBarcode(value);

      }

    }

  );



  /* =====================================================
     ACCEPT ANY BARCODE
     ===================================================== */

  function acceptBarcode(value) {


    if (!scanning) {
      return;
    }


    /*
     * NO IMEI CHECK
     * NO 15 DIGIT CHECK
     * NO LUHN CHECK
     * NO ALPHABET CHECK
     *
     * Whatever barcode says,
     * accept it.
     */

    currentValue =
      String(value);


    scanning = false;


    try {

      navigator.vibrate(250);

    } catch (e) {}


    document
      .getElementById(
        'barcodeValue'
      )
      .textContent =
      currentValue;


    document
      .getElementById(
        'result'
      )
      .style
      .display =
      'block';


    document
      .getElementById(
        'status'
      )
      .textContent =
      '✅ Barcode successfully scanned.';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent =
      '✅ Value confirmed';


    stopCameraOnly();

  }



  /* =====================================================
     STOP CAMERA
     ===================================================== */

  function stopCameraOnly() {


    try {


      if (
        scannerRunning
      ) {

        Quagga.stop();

      }

    } catch (e) {}


    scannerRunning = false;


    const scanner =
      document.getElementById(
        'scanner'
      );


    const videos =
      scanner.querySelectorAll(
        'video'
      );


    videos.forEach(
      function(video) {


        try {


          if (
            video.srcObject
          ) {


            video.srcObject
              .getTracks()
              .forEach(
                function(track) {

                  track.stop();

                }
              );

          }


          video.style.transform =
            'scale(1)';


        } catch (e) {}

      }
    );

  }



  /* =====================================================
     STOP SCANNER
     ===================================================== */

  function stopScanner() {


    scanning = false;


    stopCameraOnly();


    currentValue = '';

    candidateValue = '';

    candidateCount = 0;


    document
      .getElementById(
        'startBtn'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'stopBtn'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'result'
      )
      .style
      .display =
      'none';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent =
      '🔎 Ready';


    document
      .getElementById(
        'status'
      )
      .textContent =
      'Camera band ho gaya.';


    currentZoom = 1;

    hardwareZoomSupported = false;

    updateZoomText();

  }



  /* =====================================================
     SCAN AGAIN
     ===================================================== */

  function scanAgain() {


    scanning = false;


    stopCameraOnly();


    currentValue = '';

    candidateValue = '';

    candidateCount = 0;


    document
      .getElementById(
        'result'
      )
      .style
      .display =
      'none';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent =
      '🔎 Ready';


    currentZoom = 1;


    hardwareZoomSupported = false;


    startScanner();

  }



  /* =====================================================
     SEND VALUE BACK
     ===================================================== */

  function sendBarcodeBack() {


    if (!currentValue) {
      return;
    }


    try {

      navigator.vibrate(100);

    } catch (e) {}


    const params =
      new URLSearchParams(
        window.location.search
      );


    const returnUrl =
      params.get('return');


    /*
     * Direct scanner testing
     */

    if (!returnUrl) {


      document
        .getElementById(
          'status'
        )
        .textContent =
        '✅ Scanned: ' +
        currentValue;


      return;

    }


    const separator =
      returnUrl.includes('?')
        ? '&'
        : '?';


    /*
     * Scanner se exact barcode value
     * return URL mein bhejna.
     */

    window.location.href =
      returnUrl +
      separator +
      'barcode=' +
      encodeURIComponent(
        currentValue
      );

  }



  /* =====================================================
     PAGE CLOSE
     ===================================================== */

  window.addEventListener(
    'pagehide',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


  window.addEventListener(
    'beforeunload',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


</script>


</body>

</html>

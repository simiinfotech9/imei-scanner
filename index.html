<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>SCAN TEST v4.1</title>


  <!-- ==================================================
       SCAN TEST v4.1
       ANY BARCODE
       CAMERA + ZOOM
       ================================================== -->

  <script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

    }


    body {

      display: flex;

      flex-direction: column;

    }


    /* ==================================================
       HEADER
       ================================================== */

    .header {

      flex: 0 0 auto;

      background: #1976d2;

      padding: 8px 6px;

      text-align: center;

      font-size: 19px;

      font-weight: bold;

    }


    /* ==================================================
       VERSION
       ================================================== */

    .version {

      flex: 0 0 auto;

      background: #263238;

      color: #00ff55;

      text-align: center;

      padding: 5px 4px;

      font-size: 12px;

      font-weight: bold;

      letter-spacing: 0.4px;

      border-bottom: 1px solid #444;

    }


    /* ==================================================
       MAIN CONTAINER
       ================================================== */

    .container {

      width: 100%;

      max-width: 650px;

      margin: 0 auto;

      padding: 6px 10px;

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;

    }


    /* ==================================================
       TITLE
       ================================================== */

    .title {

      flex: 0 0 auto;

      text-align: center;

      font-size: 17px;

      font-weight: bold;

      margin: 2px 0 5px;

    }


    /* ==================================================
       STATUS
       ================================================== */

    .status {

      flex: 0 0 auto;

      background: #222;

      border-radius: 8px;

      padding: 7px;

      text-align: center;

      min-height: 36px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 13px;

      line-height: 1.2;

      margin-bottom: 6px;

    }


    /* ==================================================
       CAMERA AREA
       ================================================== */

    #scanner {

      position: relative;

      width: 100%;

      height: 220px;

      flex: 0 0 220px;

      background: #000;

      border-radius: 11px;

      overflow: hidden;

      border: 2px solid #333;

    }


    #scanner video {

      width: 100% !important;

      height: 100% !important;

      display: block;

      object-fit: cover;

    }


    #scanner canvas {

      position: absolute !important;

      top: 0 !important;

      left: 0 !important;

      width: 100% !important;

      height: 100% !important;

      pointer-events: none;

    }


    /* ==================================================
       GREEN SCAN FRAME
       ================================================== */

    .scan-frame {

      position: absolute;

      left: 7%;

      right: 7%;

      top: 27%;

      height: 46%;

      border: 3px solid #00ff55;

      border-radius: 10px;

      pointer-events: none;

      box-shadow:
        0 0 10px rgba(0,255,85,0.7);

      z-index: 10;

    }


    .scan-line {

      position: absolute;

      left: 3%;

      right: 3%;

      top: 50%;

      height: 2px;

      background: #00ff55;

      box-shadow:
        0 0 10px #00ff55;

    }


    /* ==================================================
       ZOOM
       ================================================== */

    .zoom-row {

      flex: 0 0 auto;

      height: 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      margin-top: 5px;

    }


    .zoom-btn {

      width: 58px;

      height: 34px;

      padding: 0;

      margin: 0;

      border-radius: 8px;

      border: 1px solid #555;

      background: #333;

      color: white;

      font-size: 22px;

      font-weight: bold;

    }


    .zoom-value {

      width: 75px;

      text-align: center;

      font-size: 13px;

      color: #ddd;

      font-weight: bold;

    }


    /* ==================================================
       INSTRUCTION
       ================================================== */

    .instruction {

      flex: 0 0 auto;

      text-align: center;

      color: #ccc;

      font-size: 11px;

      line-height: 1.25;

      margin: 3px 0;

    }


    /* ==================================================
       SCAN INFO
       ================================================== */

    .scan-info {

      flex: 0 0 auto;

      text-align: center;

      color: #aaa;

      font-size: 11px;

      min-height: 15px;

      margin: 2px 0;

    }


    /* ==================================================
       MAIN BUTTONS
       ================================================== */

    button {

      border: none;

      cursor: pointer;

      touch-action: manipulation;

      font-weight: bold;

    }


    button:active {

      transform: scale(0.97);

    }


    .main-btn {

      width: 100%;

      height: 42px;

      flex: 0 0 42px;

      border-radius: 9px;

      font-size: 16px;

      margin-top: 3px;

    }


    .start {

      background: #16d95a;

      color: white;

    }


    .stop {

      background: #d32f2f;

      color: white;

    }


    /* ==================================================
       RESULT BOX
       ================================================== */

    .result {

      display: none;

      flex: 0 0 auto;

      background: #1b5e20;

      padding: 8px;

      border-radius: 10px;

      text-align: center;

      margin-top: 5px;

    }


    .result-title {

      font-size: 15px;

      font-weight: bold;

      margin-bottom: 5px;

    }


    .barcode-value {

      font-size: 21px;

      font-weight: bold;

      letter-spacing: 0.5px;

      word-break: break-all;

      background: rgba(0,0,0,0.25);

      padding: 8px;

      border-radius: 7px;

      max-height: 58px;

      overflow: hidden;

    }


    /* ==================================================
       RESULT BUTTONS
       LEFT = SCAN AGAIN
       RIGHT = ACCEPT
       ================================================== */

    .result-buttons {

      width: 100%;

      display: flex;

      flex-direction: row;

      align-items: stretch;

      gap: 12px;

      margin-top: 7px;

    }


    .result-buttons button {

      flex: 1;

      width: 50%;

      height: 43px;

      margin: 0;

      padding: 0 5px;

      border-radius: 8px;

      font-size: 14px;

      font-weight: bold;

      white-space: nowrap;

    }


    /* LEFT */

    .again-btn {

      background: #555;

      color: white;

    }


    /* RIGHT */

    .use-btn {

      background: white;

      color: #1b5e20;

    }


    /* ==================================================
       HIDDEN
       ================================================== */

    .hidden {

      display: none !important;

    }


    /* ==================================================
       FOOTER
       ================================================== */

    .small-info {

      flex: 0 0 auto;

      text-align: center;

      color: #666;

      font-size: 9px;

      margin-top: 3px;

    }


    /* ==================================================
       SMALL PHONE
       ================================================== */

    @media (max-height: 700px) {


      .header {

        padding: 6px;

        font-size: 17px;

      }


      .version {

        padding: 4px;

        font-size: 11px;

      }


      .container {

        padding-top: 5px;

      }


      .title {

        font-size: 16px;

        margin-bottom: 4px;

      }


      #scanner {

        height: 185px;

        flex-basis: 185px;

      }


      .zoom-row {

        height: 34px;

      }


      .zoom-btn {

        height: 32px;

      }


      .instruction {

        font-size: 10px;

      }


      .main-btn {

        height: 39px;

        flex-basis: 39px;

        font-size: 15px;

      }


      .result {

        padding: 7px;

      }


      .barcode-value {

        font-size: 19px;

      }


      .result-buttons button {

        height: 39px;

        font-size: 13px;

      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       HEADER
       ================================================== -->

  <div class="header">

    📷 BARCODE SCANNER

  </div>


  <!-- ==================================================
       VERSION BADGE
       ================================================== -->

  <div class="version">

    🟢 SCAN TEST v4.1 • ANY BARCODE • 09-09-2026

  </div>


  <div class="container">


    <!-- TITLE -->

    <div class="title">

      Scan Any Barcode

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="status">

      Camera start karne ke liye button dabayein.

    </div>


    <!-- =================================================
         CAMERA
         ================================================= -->

    <div id="scanner">


      <div class="scan-frame">

        <div class="scan-line"></div>

      </div>


    </div>


    <!-- =================================================
         ZOOM
         ================================================= -->

    <div class="zoom-row">


      <button
        class="zoom-btn"
        onclick="changeZoom(-0.5)">

        −

      </button>


      <div
        id="zoomValue"
        class="zoom-value">

        Zoom 1.0×

      </div>


      <button
        class="zoom-btn"
        onclick="changeZoom(0.5)">

        +

      </button>


    </div>


    <!-- INSTRUCTION -->

    <div class="instruction">

      Barcode ko green frame mein rakhein.

      <br>

      Number + Alphabet dono allowed.

    </div>


    <!-- SCAN INFO -->

    <div
      id="scanInfo"
      class="scan-info">

      🔎 Ready

    </div>


    <!-- START CAMERA -->

    <button
      id="startBtn"
      class="main-btn start"
      onclick="startScanner()">

      📷 START CAMERA

    </button>


    <!-- STOP CAMERA -->

    <button
      id="stopBtn"
      class="main-btn stop hidden"
      onclick="stopScanner()">

      ✕ STOP CAMERA

    </button>


    <!-- =================================================
         RESULT
         ================================================= -->

    <div
      id="result"
      class="result">


      <div class="result-title">

        ✅ BARCODE SCANNED

      </div>


      <div
        id="barcodeValue"
        class="barcode-value">

      </div>


      <!-- ===============================================
           LEFT = SCAN AGAIN
           RIGHT = ACCEPT
           =============================================== -->

      <div class="result-buttons">


        <button
          class="again-btn"
          onclick="scanAgain()">

          🔄 SCAN AGAIN

        </button>


        <button
          class="use-btn"
          onclick="sendBarcodeBack()">

          ✓ ACCEPT

        </button>


      </div>


    </div>


    <!-- FOOTER -->

    <div class="small-info">

      SCAN TEST v4.1 • Any Barcode Value

    </div>


  </div>



<script>


  /* =====================================================
     VERSION
     ===================================================== */

  const SCANNER_VERSION =
    'SCAN TEST v4.1';


  console.log(
    '===================================='
  );

  console.log(
    SCANNER_VERSION
  );

  console.log(
    'ANY BARCODE MODE'
  );

  console.log(
    '===================================='
  );



  /* =====================================================
     VARIABLES
     ===================================================== */

  let scanning = false;

  let scannerRunning = false;

  let currentValue = '';


  /*
   * Same barcode ko 2 baar confirm karna.
   */

  let candidateValue = '';

  let candidateCount = 0;


  /*
   * Zoom
   */

  let currentZoom = 1;

  let minZoom = 1;

  let maxZoom = 1;

  let hardwareZoomSupported = false;



  /* =====================================================
     START SCANNER
     ===================================================== */

  function startScanner() {


    const status =
      document.getElementById(
        'status'
      );


    const startBtn =
      document.getElementById(
        'startBtn'
      );


    const stopBtn =
      document.getElementById(
        'stopBtn'
      );


    const result =
      document.getElementById(
        'result'
      );


    const scanInfo =
      document.getElementById(
        'scanInfo'
      );


    try {


      /*
       * QUAGGA CHECK
       */

      if (
        typeof Quagga === 'undefined'
      ) {

        throw new Error(
          'Quagga library load nahi hui.'
        );

      }



      /*
       * RESET
       */

      scanning = true;

      scannerRunning = false;

      currentValue = '';

      candidateValue = '';

      candidateCount = 0;

      currentZoom = 1;


      result.style.display =
        'none';


      startBtn.classList.add(
        'hidden'
      );


      stopBtn.classList.remove(
        'hidden'
      );


      status.textContent =
        '📷 Camera starting...';


      scanInfo.textContent =
        '🔎 Barcode searching...';



      /*
       * =================================================
       * PROVEN CAMERA SETUP
       *
       * Same LiveStream method.
       * =================================================
       */

      const config = {


        inputStream: {

          name: 'Live',

          type: 'LiveStream',


          target:
            document.getElementById(
              'scanner'
            ),


          constraints: {

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            }

          },


          /*
           * Central scanning region.
           */

          area: {

            top: '20%',

            right: '5%',

            left: '5%',

            bottom: '20%'

          }

        },


        /*
         * LOCATOR
         */

        locator: {

          patchSize: 'medium',

          halfSample: false

        },


        /*
         * WORKERS
         */

        numOfWorkers:
          navigator.hardwareConcurrency
            ? Math.min(
                4,
                navigator.hardwareConcurrency
              )
            : 2,


        /*
         * SCAN FREQUENCY
         */

        frequency: 10,


        /*
         * =================================================
         * BARCODE READERS
         *
         * Multiple common barcode formats.
         *
         * Final value par koi IMEI restriction nahi.
         * =================================================
         */

        decoder: {

          readers: [

            {
              format: 'code_128_reader',
              config: {}
            },

            {
              format: 'code_39_reader',
              config: {}
            },

            {
              format: 'code_39_vin_reader',
              config: {}
            },

            {
              format: 'code_93_reader',
              config: {}
            },

            {
              format: 'ean_reader',
              config: {}
            },

            {
              format: 'ean_8_reader',
              config: {}
            },

            {
              format: 'upc_reader',
              config: {}
            },

            {
              format: 'upc_e_reader',
              config: {}
            },

            {
              format: 'codabar_reader',
              config: {}
            },

            {
              format: 'i2of5_reader',
              config: {}
            },

            {
              format: '2of5_reader',
              config: {}
            }

          ]

        },


        locate: true,

        debug: false

      };



      /*
       * =================================================
       * INITIALIZE QUAGGA
       * =================================================
       */

      console.log(
        'Starting Quagga...'
      );


      Quagga.init(

        config,

        function(error) {


          /*
           * CAMERA ERROR
           */

          if (error) {


            console.error(
              'QUAGGA INIT ERROR:',
              error
            );


            scanning = false;


            startBtn.classList.remove(
              'hidden'
            );


            stopBtn.classList.add(
              'hidden'
            );


            status.textContent =
              '❌ Camera start nahi hua: ' +
              (
                error.message ||
                error
              );


            scanInfo.textContent =
              '';


            return;

          }



          /*
           * CAMERA START
           */

          console.log(
            'Quagga initialized.'
          );


          Quagga.start();


          scannerRunning = true;


          status.textContent =
            '✅ Camera ready';


          scanInfo.textContent =
            '🔎 Any barcode searching...';



          /*
           * Setup zoom after camera starts.
           */

          setTimeout(
            setupZoom,
            800
          );


        }

      );


    } catch (error) {


      console.error(
        'START ERROR:',
        error
      );


      scanning = false;


      startBtn.classList.remove(
        'hidden'
      );


      stopBtn.classList.add(
        'hidden'
      );


      status.textContent =
        '❌ ' +
        (
          error.message ||
          error
        );

    }

  }



  /* =====================================================
     SETUP ZOOM
     ===================================================== */

  function setupZoom() {


    try {


      const scanner =
        document.getElementById(
          'scanner'
        );


      const video =
        scanner.querySelector(
          'video'
        );


      if (
        !video ||
        !video.srcObject
      ) {

        hardwareZoomSupported =
          false;

        updateZoomText();

        return;

      }


      const tracks =
        video.srcObject
          .getVideoTracks();


      if (
        !tracks ||
        !tracks.length
      ) {

        hardwareZoomSupported =
          false;

        updateZoomText();

        return;

      }


      const track =
        tracks[0];


      if (
        !track.getCapabilities
      ) {

        hardwareZoomSupported =
          false;

        updateZoomText();

        return;

      }


      const capabilities =
        track.getCapabilities();


      if (
        capabilities &&
        capabilities.zoom
      ) {


        hardwareZoomSupported =
          true;


        minZoom =
          Number(
            capabilities.zoom.min || 1
          );


        maxZoom =
          Number(
            capabilities.zoom.max || 1
          );


        currentZoom =
          Math.max(
            minZoom,
            Math.min(
              1,
              maxZoom
            )
          );


      } else {


        /*
         * Hardware zoom nahi hai.
         *
         * Digital zoom fallback.
         */

        hardwareZoomSupported =
          false;


        minZoom = 1;

        maxZoom = 3;

        currentZoom = 1;

      }


      updateZoomText();


    } catch (error) {


      console.log(
        'Zoom setup:',
        error
      );


      hardwareZoomSupported =
        false;


      updateZoomText();

    }

  }



  /* =====================================================
     CHANGE ZOOM
     ===================================================== */

  async function changeZoom(amount) {


    if (
      !scannerRunning
    ) {

      return;

    }



    /*
     * HARDWARE ZOOM
     */

    if (
      hardwareZoomSupported
    ) {


      try {


        let newZoom =
          currentZoom + amount;


        newZoom =
          Math.max(
            minZoom,
            Math.min(
              maxZoom,
              newZoom
            )
          );


        newZoom =
          Math.round(
            newZoom * 10
          ) / 10;


        const scanner =
          document.getElementById(
            'scanner'
          );


        const video =
          scanner.querySelector(
            'video'
          );


        if (
          video &&
          video.srcObject
        ) {


          const tracks =
            video.srcObject
              .getVideoTracks();


          if (
            tracks.length
          ) {


            await tracks[0]
              .applyConstraints({

                advanced: [

                  {
                    zoom: newZoom
                  }

                ]

              });


            currentZoom =
              newZoom;


            updateZoomText();


            return;

          }

        }


      } catch (error) {


        console.log(
          'Hardware zoom error:',
          error
        );

      }

    }



    /*
     * DIGITAL ZOOM FALLBACK
     */

    currentZoom += amount;


    currentZoom =
      Math.max(
        1,
        Math.min(
          3,
          currentZoom
        )
      );


    currentZoom =
      Math.round(
        currentZoom * 10
      ) / 10;


    const scanner =
      document.getElementById(
        'scanner'
      );


    const video =
      scanner.querySelector(
        'video'
      );


    if (video) {

      video.style.transform =
        'scale(' +
        currentZoom +
        ')';

    }


    updateZoomText();

  }



  /* =====================================================
     ZOOM TEXT
     ===================================================== */

  function updateZoomText() {


    const element =
      document.getElementById(
        'zoomValue'
      );


    if (!element) {
      return;
    }


    element.textContent =
      'Zoom ' +
      currentZoom.toFixed(1) +
      '×';

  }



  /* =====================================================
     BARCODE DETECTED
     ===================================================== */

  Quagga.onDetected(

    function(result) {


      if (!scanning) {
        return;
      }


      if (!result) {
        return;
      }


      if (!result.codeResult) {
        return;
      }


      const code =
        result.codeResult.code;


      if (
        code === undefined ||
        code === null
      ) {

        return;

      }


      const value =
        String(code).trim();


      /*
       * Empty value ignore.
       */

      if (!value) {

        return;

      }


      console.log(
        'BARCODE FOUND:',
        value
      );


      /*
       * =================================================
       * ANY VALUE
       *
       * No 15 digit check.
       * No IMEI check.
       * No alphabet restriction.
       * =================================================
       */


      /*
       * Same value confirmation.
       */

      if (
        candidateValue === value
      ) {

        candidateCount++;

      } else {

        candidateValue =
          value;

        candidateCount = 1;

      }


      document
        .getElementById(
          'scanInfo'
        )
        .textContent =
        '🔎 Found — confirming ' +
        candidateCount +
        '/2';



      /*
       * Same value 2 times.
       */

      if (
        candidateCount >= 2
      ) {

        acceptBarcode(
          value
        );

      }

    }

  );



  /* =====================================================
     ACCEPT BARCODE
     ===================================================== */

  function acceptBarcode(value) {


    if (!scanning) {

      return;

    }


    /*
     * Exact barcode value.
     */

    currentValue =
      String(value);


    scanning = false;


    try {

      navigator.vibrate(250);

    } catch (e) {}


    document
      .getElementById(
        'barcodeValue'
      )
      .textContent =
      currentValue;


    document
      .getElementById(
        'result'
      )
      .style
      .display =
      'block';


    document
      .getElementById(
        'status'
      )
      .textContent =
      '✅ Barcode successfully scanned.';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent =
      '✅ Value confirmed';


    stopCameraOnly();

  }



  /* =====================================================
     STOP CAMERA ONLY
     ===================================================== */

  function stopCameraOnly() {


    try {


      if (
        scannerRunning
      ) {

        Quagga.stop();

      }

    } catch (e) {}


    scannerRunning = false;


    const scanner =
      document.getElementById(
        'scanner'
      );


    const videos =
      scanner.querySelectorAll(
        'video'
      );


    videos.forEach(
      function(video) {


        try {


          if (
            video.srcObject
          ) {


            video.srcObject
              .getTracks()
              .forEach(
                function(track) {

                  track.stop();

                }
              );

          }


          video.style.transform =
            'scale(1)';


        } catch (e) {}

      }
    );

  }



  /* =====================================================
     STOP SCANNER
     ===================================================== */

  function stopScanner() {


    scanning = false;


    stopCameraOnly();


    currentValue = '';

    candidateValue = '';

    candidateCount = 0;


    document
      .getElementById(
        'startBtn'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'stopBtn'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'result'
      )
      .style
      .display =
      'none';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent =
      '🔎 Ready';


    document
      .getElementById(
        'status'
      )
      .textContent =
      'Camera band ho gaya.';


    currentZoom = 1;

    hardwareZoomSupported = false;


    updateZoomText();

  }



  /* =====================================================
     SCAN AGAIN
     ===================================================== */

  function scanAgain() {


    scanning = false;


    stopCameraOnly();


    currentValue = '';

    candidateValue = '';

    candidateCount = 0;


    document
      .getElementById(
        'result'
      )
      .style
      .display =
      'none';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent =
      '🔎 Ready';


    currentZoom = 1;

    hardwareZoomSupported = false;


    startScanner();

  }



  /* =====================================================
     ACCEPT / USE VALUE
     ===================================================== */

  function sendBarcodeBack() {


    if (!currentValue) {

      return;

    }


    try {

      navigator.vibrate(100);

    } catch (e) {}


    const params =
      new URLSearchParams(
        window.location.search
      );


    const returnUrl =
      params.get('return');


    /*
     * Direct GitHub testing.
     */

    if (!returnUrl) {


      document
        .getElementById(
          'status'
        )
        .textContent =
        '✅ Accepted: ' +
        currentValue;


      return;

    }


    const separator =
      returnUrl.includes('?')
        ? '&'
        : '?';


    /*
     * Exact barcode value return.
     */

    window.location.href =
      returnUrl +
      separator +
      'barcode=' +
      encodeURIComponent(
        currentValue
      );

  }



  /* =====================================================
     PAGE CLOSE
     ===================================================== */

  window.addEventListener(
    'pagehide',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


  window.addEventListener(
    'beforeunload',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


</script>

</body>

</html>

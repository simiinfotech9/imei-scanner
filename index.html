<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>IMEI Scanner</title>

  <script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      background: #1976d2;
      padding: 18px 10px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .title {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin: 8px 0 16px;
    }

    .status {
      background: #222;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 14px;
      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 15px;
      line-height: 1.4;
    }

    #scanner {
      position: relative;
      width: 100%;
      height: 420px;

      background: #000;

      border-radius: 14px;

      overflow: hidden;

      border: 2px solid #333;
    }

    #scanner video {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    #scanner canvas {
      position: absolute !important;

      left: 0 !important;
      top: 0 !important;

      width: 100% !important;
      height: 100% !important;

      pointer-events: none;
    }

    /*
     * IMEI 1 barcode ke liye focused frame
     */

    .scan-frame {
      position: absolute;

      left: 6%;
      right: 6%;

      top: 30%;

      height: 27%;

      border: 3px solid #00ff55;

      border-radius: 12px;

      pointer-events: none;

      box-shadow:
        0 0 12px rgba(0,255,85,0.7);
    }

    .scan-line {
      position: absolute;

      left: 3%;
      right: 3%;

      top: 50%;

      height: 3px;

      background: #00ff55;

      box-shadow:
        0 0 12px #00ff55;
    }

    .instruction {
      text-align: center;

      color: #ddd;

      font-size: 14px;

      line-height: 1.5;

      margin: 14px 0;
    }

    button {
      width: 100%;

      border: none;

      border-radius: 10px;

      padding: 15px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 10px;

      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    .start {
      background: #16d95a;
      color: white;
    }

    .stop {
      background: #d32f2f;
      color: white;
    }

    .result {
      display: none;

      background: #1b5e20;

      padding: 18px;

      border-radius: 12px;

      text-align: center;

      margin-top: 16px;
    }

    .result-title {
      font-size: 17px;

      font-weight: bold;

      margin-bottom: 10px;
    }

    .imei {
      font-size: 25px;

      font-weight: bold;

      letter-spacing: 1px;

      word-break: break-all;

      background: rgba(0,0,0,0.25);

      padding: 12px;

      border-radius: 8px;
    }

    .use-btn {
      background: white;

      color: #1b5e20;
    }

    .again-btn {
      background: #555;

      color: white;
    }

    .hidden {
      display: none !important;
    }

    .small-info {
      text-align: center;

      color: #aaa;

      font-size: 12px;

      margin-top: 12px;
    }

    .scan-info {
      text-align: center;

      color: #aaa;

      font-size: 12px;

      min-height: 18px;

      margin-top: 8px;
    }

  </style>

</head>


<body>


  <div class="header">
    📷 IMEI SCANNER
  </div>


  <div class="container">


    <div class="title">
      Scan IMEI 1 Barcode
    </div>


    <div
      id="status"
      class="status">

      Camera start karne ke liye button dabayein.

    </div>


    <div id="scanner">

      <div class="scan-frame">

        <div class="scan-line"></div>

      </div>

    </div>


    <div class="instruction">

      📱 <b>IMEI 1</b> barcode ko green frame ke andar rakhein.

      <br>

      Barcode kisi bhi type ka ho sakta hai.

      <br>

      Sirf valid IMEI 1 detect hone par result milega.

    </div>


    <div
      id="scanInfo"
      class="scan-info">
    </div>


    <button
      id="startBtn"
      class="start"
      onclick="startScanner()">

      📷 START CAMERA

    </button>


    <button
      id="stopBtn"
      class="stop hidden"
      onclick="stopScanner()">

      ✕ STOP CAMERA

    </button>


    <div
      id="result"
      class="result">


      <div class="result-title">

        ✅ IMEI 1 SCANNED

      </div>


      <div
        id="imeiValue"
        class="imei">
      </div>


      <button
        class="use-btn"
        onclick="sendIMEIBack()">

        ✓ USE THIS IMEI

      </button>


      <button
        class="again-btn"
        onclick="scanAgain()">

        🔄 SCAN AGAIN

      </button>


    </div>


    <div class="small-info">

      Any Barcode Format • IMEI Validation

    </div>


  </div>



<script>


  let scanning = false;

  let scannerRunning = false;

  let currentIMEI = '';


  /*
   * Same IMEI ko multiple times
   * detect karna zaroori hai.
   */

  let candidateIMEI = '';

  let candidateCount = 0;


  /*
   * =====================================================
   * START SCANNER
   * =====================================================
   */

  function startScanner() {


    const status =
      document.getElementById('status');


    const startBtn =
      document.getElementById('startBtn');


    const stopBtn =
      document.getElementById('stopBtn');


    const result =
      document.getElementById('result');


    const scanInfo =
      document.getElementById('scanInfo');


    try {


      if (
        typeof Quagga === 'undefined'
      ) {

        throw new Error(
          'Barcode scanner library load nahi hui.'
        );

      }


      scanning = true;

      scannerRunning = false;

      currentIMEI = '';

      candidateIMEI = '';

      candidateCount = 0;


      result.style.display = 'none';

      scanInfo.textContent = '';


      startBtn.classList.add('hidden');

      stopBtn.classList.remove('hidden');


      status.textContent =
        '📷 Camera starting...';



      /*
       * =================================================
       * CAMERA
       *
       * Ye wahi camera setup hai jo
       * tumhare naye phone par working hai.
       * =================================================
       */

      const config = {


        inputStream: {

          name: 'Live',

          type: 'LiveStream',

          target:
            document.getElementById('scanner'),


          constraints: {

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            }

          },


          /*
           * Scanner ko central area par focus
           * karne ke liye.
           *
           * IMPORTANT:
           * Barcode FORMAT restrict nahi ho raha.
           */

          area: {

            top: '28%',

            right: '6%',

            left: '6%',

            bottom: '45%'

          }

        },


        /*
         * Barcode locator
         */

        locator: {

          patchSize: 'medium',

          halfSample: false

        },


        /*
         * Phone ke available workers
         */

        numOfWorkers:
          navigator.hardwareConcurrency
            ? Math.min(
                4,
                navigator.hardwareConcurrency
              )
            : 2,


        frequency: 10,


        /*
         * =================================================
         * IMPORTANT
         *
         * Koi ek barcode format assume nahi kiya.
         *
         * Multiple 1D formats enabled.
         * =================================================
         */

        decoder: {

          readers: [

            {
              format: 'code_128_reader',
              config: {}
            },

            {
              format: 'code_39_reader',
              config: {}
            },

            {
              format: 'code_39_vin_reader',
              config: {}
            },

            {
              format: 'code_93_reader',
              config: {}
            },

            {
              format: 'ean_reader',
              config: {}
            },

            {
              format: 'ean_8_reader',
              config: {}
            },

            {
              format: 'upc_reader',
              config: {}
            },

            {
              format: 'upc_e_reader',
              config: {}
            },

            {
              format: 'codabar_reader',
              config: {}
            },

            {
              format: 'i2of5_reader',
              config: {}
            },

            {
              format: '2of5_reader',
              config: {}
            }

          ]

        },


        locate: true,

        debug: false

      };



      /*
       * START QUAGGA
       */

      Quagga.init(

        config,

        function(error) {


          if (error) {


            console.error(
              'QUAGGA ERROR:',
              error
            );


            scanning = false;


            startBtn.classList.remove(
              'hidden'
            );


            stopBtn.classList.add(
              'hidden'
            );


            status.textContent =
              '❌ Camera start nahi hua: ' +
              (
                error.message ||
                error
              );


            return;

          }


          Quagga.start();

          scannerRunning = true;


          status.textContent =
            '✅ Camera ready — IMEI 1 barcode green frame mein rakhein.';


          scanInfo.textContent =
            '🔎 Barcode searching...';


        }

      );


    } catch (error) {


      console.error(
        'START ERROR:',
        error
      );


      scanning = false;


      startBtn.classList.remove(
        'hidden'
      );


      stopBtn.classList.add(
        'hidden'
      );


      status.textContent =
        '❌ ' +
        (
          error.message ||
          error
        );

    }

  }



  /* =====================================================
     BARCODE DETECTED
     ===================================================== */

  Quagga.onDetected(

    function(result) {


      if (!scanning) {
        return;
      }


      if (!result) {
        return;
      }


      if (!result.codeResult) {
        return;
      }


      const raw =
        result.codeResult.code;


      if (!raw) {
        return;
      }


      console.log(
        'RAW BARCODE:',
        raw
      );



      /*
       * Abhi kisi bhi barcode ko directly
       * accept nahi karenge.
       *
       * Pehle IMEI candidate niklega.
       */

      const imei =
        extractIMEI(raw);



      /*
       * 15 digit valid IMEI nahi hai
       */

      if (!imei) {


        document
          .getElementById('scanInfo')
          .textContent =
          '🔎 Barcode mil raha hai... IMEI 1 barcode dhoondh raha hoon.';


        return;

      }



      /*
       * Same IMEI ko confirm karna hai.
       */

      if (
        candidateIMEI === imei
      ) {

        candidateCount++;

      } else {

        candidateIMEI = imei;

        candidateCount = 1;

      }



      document
        .getElementById('scanInfo')
        .textContent =
        '🔎 IMEI detected — confirming... ' +
        candidateCount +
        '/2';



      /*
       * Do consecutive detections
       */

      if (
        candidateCount >= 2
      ) {

        acceptIMEI(imei);

      }

    }

  );



  /* =====================================================
     EXTRACT IMEI
     ===================================================== */

  function extractIMEI(text) {


    if (!text) {
      return null;
    }


    const value =
      String(text);


    /*
     * Remove spaces / symbols
     */

    const digits =
      value.replace(/\D/g, '');



    /*
     * Exactly 15 digits
     */

    if (
      digits.length === 15
    ) {

      if (
        isValidIMEI(digits)
      ) {

        return digits;

      }

    }



    /*
     * Extra characters/digits aaye
     * to possible 15 digit blocks check karo.
     */

    if (
      digits.length > 15
    ) {


      for (
        let i = 0;
        i <= digits.length - 15;
        i++
      ) {


        const candidate =
          digits.substring(
            i,
            i + 15
          );


        if (
          isValidIMEI(candidate)
        ) {

          return candidate;

        }

      }

    }


    return null;

  }



  /* =====================================================
     IMEI VALIDATION
     ===================================================== */

  function isValidIMEI(imei) {


    imei =
      String(imei || '')
        .replace(/\D/g, '');


    if (
      imei.length !== 15
    ) {

      return false;

    }


    let sum = 0;


    for (
      let i = 0;
      i < 15;
      i++
    ) {


      let digit =
        parseInt(
          imei.charAt(i),
          10
        );


      if (
        i % 2 === 1
      ) {

        digit *= 2;


        if (
          digit > 9
        ) {

          digit -= 9;

        }

      }


      sum += digit;

    }


    return (
      sum % 10 === 0
    );

  }



  /* =====================================================
     ACCEPT IMEI
     ===================================================== */

  function acceptIMEI(imei) {


    if (!scanning) {
      return;
    }


    currentIMEI = imei;

    scanning = false;


    try {

      navigator.vibrate(250);

    } catch (e) {}


    document
      .getElementById('imeiValue')
      .textContent =
      imei;


    document
      .getElementById('result')
      .style
      .display = 'block';


    document
      .getElementById('status')
      .textContent =
      '✅ IMEI 1 successfully scanned.';


    document
      .getElementById('scanInfo')
      .textContent =
      '✅ IMEI 1 confirmed';


    stopCameraOnly();

  }



  /* =====================================================
     STOP CAMERA
     ===================================================== */

  function stopCameraOnly() {


    try {

      if (
        scannerRunning
      ) {

        Quagga.stop();

      }

    } catch (e) {}


    scannerRunning = false;


    const scanner =
      document.getElementById('scanner');


    const videos =
      scanner.querySelectorAll(
        'video'
      );


    videos.forEach(
      function(video) {


        try {


          if (
            video.srcObject
          ) {


            video.srcObject
              .getTracks()
              .forEach(
                function(track) {

                  track.stop();

                }
              );

          }


        } catch (e) {}

      }
    );

  }



  /* =====================================================
     STOP BUTTON
     ===================================================== */

  function stopScanner() {


    scanning = false;


    stopCameraOnly();


    currentIMEI = '';

    candidateIMEI = '';

    candidateCount = 0;


    document
      .getElementById('startBtn')
      .classList
      .remove('hidden');


    document
      .getElementById('stopBtn')
      .classList
      .add('hidden');


    document
      .getElementById('result')
      .style
      .display = 'none';


    document
      .getElementById('scanInfo')
      .textContent = '';


    document
      .getElementById('status')
      .textContent =
      'Camera band ho gaya.';

  }



  /* =====================================================
     SCAN AGAIN
     ===================================================== */

  function scanAgain() {


    scanning = false;


    stopCameraOnly();


    currentIMEI = '';

    candidateIMEI = '';

    candidateCount = 0;


    document
      .getElementById('result')
      .style
      .display = 'none';


    document
      .getElementById('scanInfo')
      .textContent = '';


    startScanner();

  }



  /* =====================================================
     SEND IMEI BACK
     ===================================================== */

  function sendIMEIBack() {


    if (!currentIMEI) {
      return;
    }


    try {

      navigator.vibrate(100);

    } catch (e) {}


    const params =
      new URLSearchParams(
        window.location.search
      );


    const returnUrl =
      params.get('return');


    /*
     * Direct scanner testing
     */

    if (!returnUrl) {


      document
        .getElementById('status')
        .textContent =
        '✅ IMEI: ' +
        currentIMEI;


      return;

    }


    const separator =
      returnUrl.includes('?')
        ? '&'
        : '?';


    window.location.href =
      returnUrl +
      separator +
      'imei=' +
      encodeURIComponent(
        currentIMEI
      );

  }



  /* =====================================================
     PAGE CLOSE
     ===================================================== */

  window.addEventListener(
    'pagehide',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


  window.addEventListener(
    'beforeunload',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>IMEI Scanner</title>

  <script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }


    body {
      display: flex;
      flex-direction: column;
    }


    /* =========================
       HEADER
       ========================= */

    .header {
      flex: 0 0 auto;

      background: #1976d2;

      padding: 11px 8px;

      text-align: center;

      font-size: 20px;

      font-weight: bold;
    }


    /* =========================
       MAIN
       ========================= */

    .container {
      width: 100%;
      max-width: 650px;

      margin: 0 auto;

      padding: 8px 12px 10px;

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;
    }


    .title {
      flex: 0 0 auto;

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      margin: 3px 0 7px;
    }


    /* =========================
       STATUS
       ========================= */

    .status {
      flex: 0 0 auto;

      background: #222;

      border-radius: 9px;

      padding: 8px;

      text-align: center;

      min-height: 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 13px;

      line-height: 1.25;

      margin-bottom: 7px;
    }


    /* =========================
       CAMERA
       ========================= */

    #scanner {

      position: relative;

      width: 100%;

      height: 235px;

      flex: 0 0 235px;

      background: #000;

      border-radius: 12px;

      overflow: hidden;

      border: 2px solid #333;
    }


    #scanner video {

      width: 100% !important;

      height: 100% !important;

      object-fit: cover;
    }


    #scanner canvas {

      position: absolute !important;

      top: 0 !important;

      left: 0 !important;

      width: 100% !important;

      height: 100% !important;

      pointer-events: none;
    }


    /* =========================
       GREEN SCAN FRAME
       ========================= */

    .scan-frame {

      position: absolute;

      left: 7%;

      right: 7%;

      top: 28%;

      height: 44%;

      border: 3px solid #00ff55;

      border-radius: 10px;

      pointer-events: none;

      box-shadow:
        0 0 10px rgba(0,255,85,0.65);
    }


    .scan-line {

      position: absolute;

      left: 3%;

      right: 3%;

      top: 50%;

      height: 2px;

      background: #00ff55;

      box-shadow:
        0 0 10px #00ff55;
    }


    /* =========================
       ZOOM CONTROLS
       ========================= */

    .zoom-row {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      margin-top: 6px;
    }


    .zoom-btn {

      width: 58px;

      height: 38px;

      margin: 0;

      padding: 0;

      border-radius: 9px;

      background: #333;

      color: white;

      font-size: 22px;

      font-weight: bold;

      border: 1px solid #555;
    }


    .zoom-value {

      min-width: 70px;

      text-align: center;

      color: #ddd;

      font-size: 13px;

      font-weight: bold;
    }


    /* =========================
       INSTRUCTION
       ========================= */

    .instruction {

      flex: 0 0 auto;

      text-align: center;

      color: #ccc;

      font-size: 12px;

      line-height: 1.25;

      margin: 6px 0;
    }


    /* =========================
       BUTTONS
       ========================= */

    button {

      border: none;

      border-radius: 9px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      touch-action: manipulation;
    }


    button:active {

      transform: scale(0.97);
    }


    .main-btn {

      width: 100%;

      height: 44px;

      flex: 0 0 44px;

      margin-top: 3px;

      font-size: 16px;
    }


    .start {

      background: #16d95a;

      color: white;
    }


    .stop {

      background: #d32f2f;

      color: white;
    }


    /* =========================
       RESULT
       ========================= */

    .result {

      display: none;

      flex: 0 0 auto;

      background: #1b5e20;

      padding: 10px;

      border-radius: 10px;

      text-align: center;

      margin-top: 7px;
    }


    .result-title {

      font-size: 15px;

      font-weight: bold;

      margin-bottom: 5px;
    }


    .imei {

      font-size: 22px;

      font-weight: bold;

      letter-spacing: 1px;

      word-break: break-all;

      background: rgba(0,0,0,0.25);

      padding: 8px;

      border-radius: 7px;
    }


    .use-btn {

      width: 100%;

      height: 40px;

      margin-top: 7px;

      background: white;

      color: #1b5e20;
    }


    .again-btn {

      width: 100%;

      height: 40px;

      margin-top: 6px;

      background: #555;

      color: white;
    }


    .hidden {

      display: none !important;
    }


    .scan-info {

      text-align: center;

      color: #aaa;

      font-size: 11px;

      min-height: 14px;

      margin-top: 3px;
    }


    .small-info {

      text-align: center;

      color: #777;

      font-size: 10px;

      margin-top: 4px;
    }


  </style>

</head>


<body>


  <div class="header">
    📷 IMEI SCANNER
  </div>


  <div class="container">


    <div class="title">
      Scan IMEI 1 Barcode
    </div>


    <div
      id="status"
      class="status">

      Camera start karne ke liye button dabayein.

    </div>


    <!-- CAMERA -->

    <div id="scanner">

      <div class="scan-frame">

        <div class="scan-line"></div>

      </div>

    </div>


    <!-- ZOOM -->

    <div class="zoom-row">

      <button
        id="zoomOutBtn"
        class="zoom-btn"
        onclick="changeZoom(-0.5)">

        −

      </button>


      <div
        id="zoomValue"
        class="zoom-value">

        Zoom 1.0×

      </div>


      <button
        id="zoomInBtn"
        class="zoom-btn"
        onclick="changeZoom(0.5)">

        +

      </button>

    </div>


    <div class="instruction">

      📱 IMEI 1 barcode ko green frame mein rakhein

      <br>

      <b>+ / − se camera zoom karein</b>

    </div>


    <div
      id="scanInfo"
      class="scan-info">

      🔎 Barcode searching...

    </div>


    <!-- START -->

    <button
      id="startBtn"
      class="main-btn start"
      onclick="startScanner()">

      📷 START CAMERA

    </button>


    <!-- STOP -->

    <button
      id="stopBtn"
      class="main-btn stop hidden"
      onclick="stopScanner()">

      ✕ STOP CAMERA

    </button>


    <!-- RESULT -->

    <div
      id="result"
      class="result">


      <div class="result-title">

        ✅ IMEI 1 SCANNED

      </div>


      <div
        id="imeiValue"
        class="imei">

      </div>


      <button
        class="use-btn"
        onclick="sendIMEIBack()">

        ✓ USE THIS IMEI

      </button>


      <button
        class="again-btn"
        onclick="scanAgain()">

        🔄 SCAN AGAIN

      </button>


    </div>


    <div class="small-info">

      Any Barcode Format • IMEI Scanner

    </div>


  </div>



<script>


  let scanning = false;

  let scannerRunning = false;

  let currentIMEI = '';

  let candidateIMEI = '';

  let candidateCount = 0;


  /* =========================
     ZOOM
     ========================= */

  let currentZoom = 1;

  let minZoom = 1;

  let maxZoom = 1;

  let zoomSupported = false;



  /* =====================================================
     START SCANNER
     ===================================================== */

  function startScanner() {


    const status =
      document.getElementById('status');

    const startBtn =
      document.getElementById('startBtn');

    const stopBtn =
      document.getElementById('stopBtn');

    const result =
      document.getElementById('result');

    const scanInfo =
      document.getElementById('scanInfo');


    try {


      if (
        typeof Quagga === 'undefined'
      ) {

        throw new Error(
          'Barcode scanner library load nahi hui.'
        );

      }


      scanning = true;

      scannerRunning = false;

      currentIMEI = '';

      candidateIMEI = '';

      candidateCount = 0;

      currentZoom = 1;


      result.style.display = 'none';


      startBtn.classList.add(
        'hidden'
      );


      stopBtn.classList.remove(
        'hidden'
      );


      scanInfo.textContent =
        '🔎 Barcode searching...';


      status.textContent =
        '📷 Camera starting...';



      /* ===============================================
         CAMERA
         =============================================== */

      const config = {


        inputStream: {

          name: 'Live',

          type: 'LiveStream',

          target:
            document.getElementById(
              'scanner'
            ),


          constraints: {

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            }

          },


          area: {

            top: '28%',

            right: '6%',

            left: '6%',

            bottom: '45%'

          }

        },


        locator: {

          patchSize: 'medium',

          halfSample: false

        },


        numOfWorkers:
          navigator.hardwareConcurrency
            ? Math.min(
                4,
                navigator.hardwareConcurrency
              )
            : 2,


        frequency: 10,


        decoder: {

          readers: [

            {
              format: 'code_128_reader',
              config: {}
            },

            {
              format: 'code_39_reader',
              config: {}
            },

            {
              format: 'code_39_vin_reader',
              config: {}
            },

            {
              format: 'code_93_reader',
              config: {}
            },

            {
              format: 'ean_reader',
              config: {}
            },

            {
              format: 'ean_8_reader',
              config: {}
            },

            {
              format: 'upc_reader',
              config: {}
            },

            {
              format: 'upc_e_reader',
              config: {}
            },

            {
              format: 'codabar_reader',
              config: {}
            },

            {
              format: 'i2of5_reader',
              config: {}
            },

            {
              format: '2of5_reader',
              config: {}
            }

          ]

        },


        locate: true,

        debug: false

      };



      Quagga.init(

        config,

        function(error) {


          if (error) {


            console.error(
              'QUAGGA ERROR:',
              error
            );


            scanning = false;


            startBtn.classList.remove(
              'hidden'
            );


            stopBtn.classList.add(
              'hidden'
            );


            status.textContent =
              '❌ Camera start nahi hua: ' +
              (
                error.message ||
                error
              );


            return;

          }


          Quagga.start();

          scannerRunning = true;


          status.textContent =
            '✅ Camera ready — IMEI 1 scan karein.';


          scanInfo.textContent =
            '🔎 Barcode searching...';


          /*
           * Camera start hone ke thodi der baad
           * zoom capabilities check karo.
           */

          setTimeout(
            setupZoom,
            500
          );


        }

      );


    } catch (error) {


      console.error(
        'START ERROR:',
        error
      );


      scanning = false;


      startBtn.classList.remove(
        'hidden'
      );


      stopBtn.classList.add(
        'hidden'
      );


      status.textContent =
        '❌ ' +
        (
          error.message ||
          error
        );

    }

  }



  /* =====================================================
     SETUP ZOOM
     ===================================================== */

  function setupZoom() {


    try {


      const scanner =
        document.getElementById(
          'scanner'
        );


      const video =
        scanner.querySelector(
          'video'
        );


      if (!video) {

        updateZoomText(
          'Zoom 1.0×'
        );

        return;

      }


      if (!video.srcObject) {

        updateZoomText(
          'Zoom 1.0×'
        );

        return;

      }


      const tracks =
        video.srcObject.getVideoTracks();


      if (
        !tracks ||
        !tracks.length
      ) {

        updateZoomText(
          'Zoom 1.0×'
        );

        return;

      }


      const track =
        tracks[0];


      const capabilities =
        track.getCapabilities
          ? track.getCapabilities()
          : null;


      if (
        capabilities &&
        capabilities.zoom
      {


        zoomSupported = true;


        minZoom =
          Number(
            capabilities.zoom.min || 1
          );


        maxZoom =
          Number(
            capabilities.zoom.max || 1
          );


        currentZoom =
          Math.max(
            minZoom,
            Math.min(
              1,
              maxZoom
            )
          );


        updateZoomText();


      } else {


        zoomSupported = false;

        minZoom = 1;

        maxZoom = 1;

        currentZoom = 1;


        updateZoomText(
          'Zoom unavailable'
        );

      }


    } catch (error) {


      console.log(
        'Zoom setup:',
        error
      );


      zoomSupported = false;

      updateZoomText(
        'Zoom 1.0×'
      );

    }

  }



  /* =====================================================
     CHANGE ZOOM
     ===================================================== */

  async function changeZoom(amount) {


    if (!scannerRunning) {

      return;

    }


    try {


      /*
       * Agar phone hardware zoom support nahi karta
       */

      if (!zoomSupported) {


        document
          .getElementById(
            'scanInfo'
          )
          .textContent =
          'ℹ️ Is phone/browser mein camera zoom available nahi hai.';


        setTimeout(
          function() {

            document
              .getElementById(
                'scanInfo'
              )
              .textContent =
              '🔎 Barcode searching...';

          },
          1800
        );


        return;

      }



      let newZoom =
        currentZoom + amount;


      newZoom =
        Math.max(
          minZoom,
          Math.min(
            maxZoom,
            newZoom
          )
        );


      newZoom =
        Math.round(
          newZoom * 10
        ) / 10;



      const scanner =
        document.getElementById(
          'scanner'
        );


      const video =
        scanner.querySelector(
          'video'
        );


      if (
        !video ||
        !video.srcObject
      ) {

        return;

      }


      const tracks =
        video.srcObject.getVideoTracks();


      if (
        !tracks.length
      ) {

        return;

      }


      const track =
        tracks[0];


      await track.applyConstraints({

        advanced: [

          {
            zoom: newZoom
          }

        ]

      });


      currentZoom =
        newZoom;


      updateZoomText();


    } catch (error) {


      console.log(
        'Zoom error:',
        error
      );


      document
        .getElementById(
          'scanInfo'
        )
        .textContent =
        'ℹ️ Zoom is phone camera par available nahi hai.';


      setTimeout(
        function() {

          document
            .getElementById(
              'scanInfo'
            )
            .textContent =
            '🔎 Barcode searching...';

        },
        1800
      );

    }

  }



  /* =====================================================
     ZOOM TEXT
     ===================================================== */

  function updateZoomText(customText) {


    const element =
      document.getElementById(
        'zoomValue'
      );


    if (!element) {
      return;
    }


    if (customText) {

      element.textContent =
        customText;

      return;

    }


    element.textContent =
      'Zoom ' +
      currentZoom.toFixed(1) +
      '×';

  }



  /* =====================================================
     BARCODE DETECTED
     ===================================================== */

  Quagga.onDetected(

    function(result) {


      if (!scanning) {
        return;
      }


      if (!result) {
        return;
      }


      if (!result.codeResult) {
        return;
      }


      const raw =
        result.codeResult.code;


      if (!raw) {
        return;
      }


      console.log(
        'RAW BARCODE:',
        raw
      );



      /*
       * IMEI candidate
       */

      const imei =
        extractIMEI(raw);



      if (!imei) {


        document
          .getElementById(
            'scanInfo'
          )
          .textContent =
          '🔎 Barcode mil raha hai...';


        return;

      }



      /*
       * Same IMEI ko confirm karna
       */

      if (
        candidateIMEI === imei
      ) {

        candidateCount++;

      } else {

        candidateIMEI = imei;

        candidateCount = 1;

      }



      document
        .getElementById(
          'scanInfo'
        )
        .textContent =
        '🔎 IMEI confirm ho raha hai... ' +
        candidateCount +
        '/2';



      if (
        candidateCount >= 2
      ) {

        acceptIMEI(imei);

      }

    }

  );



  /* =====================================================
     EXTRACT IMEI
     ===================================================== */

  function extractIMEI(text) {


    if (!text) {
      return null;
    }


    const value =
      String(text);


    const digits =
      value.replace(
        /\D/g,
        ''
      );


    if (
      digits.length === 15
    ) {

      if (
        isValidIMEI(digits)
      ) {

        return digits;

      }

    }


    if (
      digits.length > 15
    ) {


      for (
        let i = 0;
        i <= digits.length - 15;
        i++
      ) {


        const candidate =
          digits.substring(
            i,
            i + 15
          );


        if (
          isValidIMEI(candidate)
        ) {

          return candidate;

        }

      }

    }


    return null;

  }



  /* =====================================================
     IMEI VALIDATION
     ===================================================== */

  function isValidIMEI(imei) {


    imei =
      String(imei || '')
        .replace(
          /\D/g,
          ''
        );


    if (
      imei.length !== 15
    ) {

      return false;

    }


    let sum = 0;


    for (
      let i = 0;
      i < 15;
      i++
    ) {


      let digit =
        parseInt(
          imei.charAt(i),
          10
        );


      if (
        i % 2 === 1
      ) {

        digit *= 2;


        if (
          digit > 9
        ) {

          digit -= 9;

        }

      }


      sum += digit;

    }


    return (
      sum % 10 === 0
    );

  }



  /* =====================================================
     ACCEPT IMEI
     ===================================================== */

  function acceptIMEI(imei) {


    if (!scanning) {
      return;
    }


    currentIMEI = imei;

    scanning = false;


    try {

      navigator.vibrate(250);

    } catch (e) {}



    document
      .getElementById(
        'imeiValue'
      )
      .textContent =
      imei;


    document
      .getElementById(
        'result'
      )
      .style
      .display = 'block';


    document
      .getElementById(
        'status'
      )
      .textContent =
      '✅ IMEI 1 successfully scanned.';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent =
      '✅ IMEI 1 confirmed';


    stopCameraOnly();

  }



  /* =====================================================
     STOP CAMERA
     ===================================================== */

  function stopCameraOnly() {


    try {

      if (
        scannerRunning
      ) {

        Quagga.stop();

      }

    } catch (e) {}


    scannerRunning = false;


    const scanner =
      document.getElementById(
        'scanner'
      );


    const videos =
      scanner.querySelectorAll(
        'video'
      );


    videos.forEach(
      function(video) {


        try {


          if (
            video.srcObject
          ) {


            video.srcObject
              .getTracks()
              .forEach(
                function(track) {

                  track.stop();

                }
              );

          }


        } catch (e) {}

      }
    );

  }



  /* =====================================================
     STOP BUTTON
     ===================================================== */

  function stopScanner() {


    scanning = false;


    stopCameraOnly();


    currentIMEI = '';

    candidateIMEI = '';

    candidateCount = 0;


    document
      .getElementById(
        'startBtn'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'stopBtn'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'result'
      )
      .style
      .display = 'none';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent = '';


    document
      .getElementById(
        'status'
      )
      .textContent =
      'Camera band ho gaya.';


    updateZoomText(
      'Zoom 1.0×'
    );

  }



  /* =====================================================
     SCAN AGAIN
     ===================================================== */

  function scanAgain() {


    scanning = false;


    stopCameraOnly();


    currentIMEI = '';

    candidateIMEI = '';

    candidateCount = 0;


    document
      .getElementById(
        'result'
      )
      .style
      .display = 'none';


    document
      .getElementById(
        'scanInfo'
      )
      .textContent = '';


    startScanner();

  }



  /* =====================================================
     SEND IMEI BACK
     ===================================================== */

  function sendIMEIBack() {


    if (!currentIMEI) {
      return;
    }


    try {

      navigator.vibrate(100);

    } catch (e) {}


    const params =
      new URLSearchParams(
        window.location.search
      );


    const returnUrl =
      params.get('return');


    /*
     * Direct scanner testing
     */

    if (!returnUrl) {


      document
        .getElementById(
          'status'
        )
        .textContent =
        '✅ IMEI: ' +
        currentIMEI;


      return;

    }


    const separator =
      returnUrl.includes('?')
        ? '&'
        : '?';


    window.location.href =
      returnUrl +
      separator +
      'imei=' +
      encodeURIComponent(
        currentIMEI
      );

  }



  /* =====================================================
     PAGE CLOSE
     ===================================================== */

  window.addEventListener(
    'pagehide',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


  window.addEventListener(
    'beforeunload',
    function() {

      scanning = false;

      stopCameraOnly();

    }
  );


</script>

</body>

</html>
